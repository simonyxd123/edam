{{- /*
  密钥对象。

  ⚠️ **两个 Secret，别合并**（2026-11-14 代码审计第七轮）：

  1. `edam-secret` —— 由 **External Secrets Operator** 从 Vault 写入
     （见 templates/external-secret.yaml）。helm **不渲染**它
     （externalSecrets.enabled=true 时）。
     理由：helm 渲染的永远是仓库里的占位符，而 ArgoCD 每次同步都会把
     占位符重新 apply 回去 ⇒ 与 ESO 抢同一个对象的同一个字段 ⇒
     占位符会被回灌，生产实际使用的就是公开值。
     —— "两边一致"这个约束反而把公开值坐实成了生产实际使用的值。

  2. `edam-admin-secret` —— 由 **helm** 渲染，只放 admin 初始密码。
     它不经过 Vault（生产上是空的 ⇒ 不建任何默认账号，fail-closed），
     所以不该跟 ESO 管理的密钥混在一个对象里。

  拆开之后：每个 Secret 只有**一个**写者，没有字段归属之争，
  删掉任何一个都不会牵连另一个。
*/ -}}
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edam.fullname" . }}-secret
  labels:
    {{- include "edam.labels" . | nindent 4 }}
type: Opaque
data:
  # 开发环境（externalSecrets.enabled=false）直接用 values 里的值。
  # 生产环境走 Vault，这里**不渲染** —— 见上面的说明。
  db-password: {{ .Values.secret.dbPassword | b64enc | quote }}
  vault-token: {{ .Values.secret.vaultToken | b64enc | quote }}
  jwt-secret: {{ .Values.secret.jwtSecret | b64enc | quote }}
  # Worker → Backend 回调共享密钥（后端 edam.worker.token）
  worker-token: {{ .Values.secret.workerToken | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edam.fullname" . }}-admin-secret
  labels:
    {{- include "edam.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secret.adminPassword }}
data:
  # 初始 admin 密码；留空则后端不创建任何默认账号（fail-closed）。
  # 这条**不经过 Vault** —— 生产上就是空的，靠 ESO 把它管起来没有意义。
  admin-password: {{ .Values.secret.adminPassword | b64enc | quote }}
{{- else }}
# 没有初始密码 ⇒ 后端不创建任何默认账号（fail-closed）。
data: {}
{{- end }}
