{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "edam.serviceAccountName" . }}
  labels:
    {{- include "edam.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# 两个组件都不调用 Kubernetes API，也不需要挂 token
automountServiceAccountToken: false
{{- end }}
