{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "edam.fullname" . }}
  labels:
    {{- include "edam.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                # 统一入口是 nginx 网关：它负责把 /api 与 /ws 转给后端，
                # 其余转给前端 SPA。直接指后端的话访问根路径只会拿到
                # 后端 404 —— 前端根本不存在。
                name: {{ include "edam.fullname" $ }}-nginx
                port:
                  number: {{ $.Values.nginx.service.port }}
          {{- end }}
    {{- end }}
{{- end }}