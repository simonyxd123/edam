apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edam.fullname" . }}-backend
  labels:
    {{- include "edam.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "edam.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edam.backend.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ include "edam.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "edam.fullname" . }}-secret
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "edam.fullname" . }}-secret
                  key: jwt-secret
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "edam.fullname" . }}-secret
                  key: vault-token
            - name: WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "edam.fullname" . }}-secret
                  key: worker-token
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "edam.fullname" . }}-secret
                  key: admin-password
                  optional: true
          livenessProbe:
            {{- if .Values.backend.probes.liveness.enabled }}
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            {{- end }}
          readinessProbe:
            {{- if .Values.backend.probes.readiness.enabled }}
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache
            # 日志目录：readOnlyRootFilesystem=true 时 /var/log/edam 不存在，
            # 不挂 volume 的话 Logback FileAppender 会静默失败
            - name: log
              mountPath: /var/log/edam
      volumes:
        - name: tmp
          # 8GB 上传（max-file-size=8GB + file-size-threshold=0 强制落盘）
          # 需要 ≥8GB 可用临时磁盘。不设 sizeLimit 的话会直接吃
          # 节点可分配磁盘，一个大上传能把 kubelet 拖到 disk-pressure。
          emptyDir:
            sizeLimit: {{ .Values.backend.tmpVolumeSizeLimit | default "20Gi" }}
        - name: cache
          emptyDir: {}
        - name: log
          emptyDir:
            sizeLimit: {{ .Values.backend.logVolumeSizeLimit | default "2Gi" }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}