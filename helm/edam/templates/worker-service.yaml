apiVersion: v1
kind: Service
metadata:
  name: {{ include "edam.fullname" . }}-worker
  labels:
    {{- include "edam.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    # 健康探针 / 运维接口（/health/live、/health/ready、/health/worker）
    - port: {{ .Values.worker.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    # Prometheus 指标（/metrics）
    - port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "edam.worker.selectorLabels" . | nindent 4 }}
