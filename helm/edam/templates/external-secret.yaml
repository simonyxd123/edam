{{- if .Values.externalSecrets.enabled }}
{{- /*
  External Secrets：从 Vault 同步密钥到 K8s Secret。

  ⚠️ **为什么放在 chart 里，而不是单独一个 yaml 文件**
  （2026-11-14 代码审计第七轮）：

  原来这份清单放在 `gitops/argocd/external-secrets.yaml`，
  而**三个 ArgoCD Application 都不引用它**（它们部署的是 helm chart），
  `gitops/README.md` 的安装步骤里也没有 apply 它 ——
  ⇒ 这套 External Secrets **从来没有被下发到集群**。
  叠加 AppProject 的 `namespaceResourceWhitelist` 里**没有**
  `external-secrets.io` 这一组 ⇒ 连 ArgoCD 想部署都部署不了。

  结果：生产实际的密钥就是 helm 渲染出来的占位符
  （`REPLACE_FROM_VAULT` / `change-me-in-production`）——
  这些值在 Git 里公开 ⇒ JWT 可被伪造、Worker 回调可被伪造。

  放进 chart 之后：
  - ArgoCD 部署 chart 时**顺带**把 ExternalSecret 部署到**当前环境的命名空间**
    （dev / staging / prod 各自的 namespace，不再是写死的 `edam`）；
  - 命名空间跟着 release 走 ⇒ 一套模板三环境通用。

  依赖：集群里装了 External Secrets Operator + Vault。
  没装的话 ArgoCD 会报 "no matches for kind ExternalSecret"（同步失败，
  **不会**静默用占位符跑起来 —— 这正是我们要的行为）。
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "edam.fullname" . }}-vault
  labels:
    {{- include "edam.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.vault.server | quote }}
      path: {{ .Values.externalSecrets.vault.path | quote }}
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: {{ .Values.externalSecrets.vault.role | quote }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "edam.fullname" . }}-secret
  labels:
    {{- include "edam.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "edam.fullname" . }}-vault
    kind: SecretStore
  target:
    name: {{ include "edam.fullname" . }}-secret
    # Owner：ESO 拥有这个 Secret，删掉 ExternalSecret 会把它一起删掉。
    # 整份清单只有**一个** ExternalSecret 指向这个 target ——
    # 多个 ExternalSecret 共享一个 target 且都是 Owner 时，
    # 删掉其中任意一个都会把整个 Secret 连带另外几个的密钥一起带走。
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: {{ .Values.externalSecrets.keys.dbPassword.key | quote }}
        property: {{ .Values.externalSecrets.keys.dbPassword.property | quote }}
    - secretKey: db-username
      remoteRef:
        key: {{ .Values.externalSecrets.keys.dbUsername.key | quote }}
        property: {{ .Values.externalSecrets.keys.dbUsername.property | quote }}
    - secretKey: jwt-secret
      remoteRef:
        key: {{ .Values.externalSecrets.keys.jwtSecret.key | quote }}
        property: {{ .Values.externalSecrets.keys.jwtSecret.property | quote }}
    - secretKey: vault-token
      remoteRef:
        key: {{ .Values.externalSecrets.keys.vaultToken.key | quote }}
        property: {{ .Values.externalSecrets.keys.vaultToken.property | quote }}
    # Worker → Backend 回调共享密钥。
    # 原来这一条**完全没有 ExternalSecret** ⇒ 生产里它就是 helm 渲染的
    # `REPLACE_FROM_VAULT` —— 而 Worker 与 Backend 两边读到同一个公开值，
    # 校验自然通过 ⇒ 任何人都能伪造文档状态回调
    # （把没水印的文档标成已加水印 / 往指纹登记表写伪造指纹）。
    - secretKey: worker-token
      remoteRef:
        key: {{ .Values.externalSecrets.keys.workerToken.key | quote }}
        property: {{ .Values.externalSecrets.keys.workerToken.property | quote }}
{{- end }}
