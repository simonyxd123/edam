# ============================================================================
# Helm Chart 默认值
# ============================================================================

# 全局配置
global:
  imageRegistry: ""
  imagePullSecrets: []

# 后端服务（Spring Boot）
backend:
  enabled: true
  name: backend
  image:
    repository: edam/backend
    tag: "3.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 3
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
      # 临时磁盘（8GB 上传落盘用）。不声明的话调度器看不见这块压力，
      # eviction 时会随机挑 Pod，8GB 上传中途被杀
      ephemeral-storage: 20Gi
    limits:
      cpu: 2000m
      memory: 4Gi
      ephemeral-storage: 30Gi
  # emptyDir 容量上限
  tmpVolumeSizeLimit: 20Gi
  logVolumeSizeLimit: 2Gi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  service:
    type: ClusterIP
    port: 8092
  env:
    SPRING_PROFILES_ACTIVE: production
    SERVER_PORT: 8092
    LOG_LEVEL: INFO
    # 关键配置通过 Secret 注入
    VAULT_ADDR: http://vault:8200
    MYSQL_HOST: mysql.edam.svc.cluster.local
    MYSQL_PORT: "3306"
    REDIS_HOST: redis-cluster.edam.svc.cluster.local
    REDIS_PORT: "6379"
    MINIO_ENDPOINT: http://minio.edam.svc.cluster.local:9000
    RABBITMQ_HOST: rabbitmq.edam.svc.cluster.local
    RABBITMQ_PORT: "5672"
    # 初始管理员：production 不配 ADMIN_INITIAL_PASSWORD 就不建任何账号
    ADMIN_INITIAL_PASSWORD: ""
    CREATE_DEFAULT_ADMIN: "false"
  probes:
    liveness:
      enabled: true
      # 必须带 context-path：application.yml 里 server.servlet.context-path=/api/v1
      # 少了前缀 → 404 → readiness 失败 Pod 永不进 Endpoints，liveness 失败
      # 60s 后 K8s 直接 CrashLoopBackOff
      path: /api/v1/health/live
      initialDelaySeconds: 60
      periodSeconds: 10
    readiness:
      enabled: true
      path: /api/v1/health/ready
      initialDelaySeconds: 30
      periodSeconds: 5
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /api/v1/actuator/prometheus

# Python Worker
worker:
  enabled: true
  name: worker
  image:
    repository: edam/worker
    tag: "3.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 8001
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  env:
    WORKER_TYPE: async_pipeline
    LOG_LEVEL: INFO
    RABBITMQ_HOST: rabbitmq.edam.svc.cluster.local
    RABBITMQ_PORT: "5672"
    RABBITMQ_USER: edam
    RABBITMQ_PASSWORD: edampass
    # 关键：worker 回调后端用的地址。
    # 原先没配 → 落到代码默认值 http://localhost:8092 → 在 K8s 里
    # worker 打到自己的 8092 端口，必失败，且没有任何日志能看出来。
    # 注意后端有 context-path=/api/v1
    BACKEND_BASE_URL: http://edam-backend:8092/api/v1
    MINIO_ENDPOINT: http://minio.edam.svc.cluster.local:9000
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
    MINIO_BUCKET_VIDEOS: edam-videos
    MINIO_BUCKET_DOCS: edam-documents
    HTTP_PORT: "8001"
    # 运维接口（按 video_id 重触发 HLS）：默认关闭，
    # 需要时在 overlays 里设 OPS_ENABLED=true
    OPS_ENABLED: "false"

# Nginx 网关（统一入口：/api 与 /ws → 后端，其余 → 前端 SPA）
nginx:
  enabled: true
  name: nginx
  image:
    repository: nginx:1.25-alpine
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 3
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  service:
    type: LoadBalancer
    port: 80
    httpsPort: 443
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-ssl-cert: ""
  config:
    # 与后端 spring.servlet.multipart.max-file-size=8GB 对齐
    clientMaxBodySize: "8g"
    # NOTE: upstream server names must be the REAL Service names.
    # The old value was "backend:8080" but the actual name is
    # {{fullname}}-backend - nginx would fail with "host not found in upstream".
    nginxConf: |
      worker_processes auto;
      events { worker_connections 4096; }
      http {
        include /etc/nginx/mime.types;
        client_max_body_size {{ .Values.nginx.config.clientMaxBodySize }};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;

        upstream edam_backend {
          least_conn;
          server {{ include "edam.fullname" . }}-backend:{{ .Values.backend.service.port }};
        }
        upstream edam_web {
          least_conn;
          server {{ include "edam.fullname" . }}-web:{{ .Values.web.service.port }};
        }

        server {
          listen 80;
          server_name _;

          # backend API (keep the /api/v1 prefix - backend context-path=/api/v1)
          location /api/ {
            proxy_pass http://edam_backend;
          }

          # WebSocket (STOMP over WebSocket) - upgrade headers required
          location /ws {
            proxy_pass http://edam_backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
          }

          # frontend SPA (everything else)
          location / {
            proxy_pass http://edam_web;
          }
        }
      }

# 前端（Vue3 SPA 静态资源，镜像自带 nginx）
web:
  enabled: true
  image:
    repository: edam/web
    tag: "3.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "21600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "21600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: edam-tls
      hosts:
        - api.example.com

# 服务账户
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod 安全
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# 资源（生产级）
resources: {}

# 节点选择
nodeSelector: {}
tolerations: []
affinity: {}

# 密钥（生产环境必须通过 --set 或外部 secret 覆盖）
secret:
  dbPassword: "change-me-in-production"
  vaultToken: "change-me-in-production"
  jwtSecret: "change-me-in-production-must-be-256-bit"
  # Worker → Backend 回调共享密钥（后端 edam.worker.token）
  workerToken: "change-me-in-production"
  # 初始 admin 密码；留空则后端不创建任何默认账号（fail-closed）
  adminPassword: ""