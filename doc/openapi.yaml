  # ===== Webhook 回调（v3.1 新增）=====
  /webhooks:
    get:
      tags: [webhooks]
      summary: 当前用户注册的回调列表
      x-required-permission: webhook:read
      responses:
        '200':
          description: 回调列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
    post:
      tags: [webhooks]
      summary: 注册回调
      x-required-permission: webhook:manage
      description: |
        注册外部系统回调 URL，事件触发时推送。
        回调 URL 必须支持 HTTPS；签名机制：HMAC-SHA256(secret, body)

        **注册是真的落库**（webhook 表），secret 明文只在创建响应里返回一次，
        库里只存 SHA-256 哈希。

        ⚠️ **投递（delivery）链路尚未接线** —— 目前**没有**任何事件会触发投递，
        所以注册后不会收到回调。原因：签名需要 secret 明文，而表里只有哈希
        （可签名的密钥存储方案待定），且首次投递没有触发入口。
        详见 README 的「已知限制」。
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: url 非法（为空 / 非 http(s) / 指向内网或回环地址）

  /webhooks/{webhook_id}:
    parameters:
      - in: path
        name: webhook_id
        required: true
        schema: { type: integer }
    delete:
      tags: [webhooks]
      summary: 注销回调
      x-required-permission: webhook:manage
      responses:
        '204':
          description: 成功

  /webhooks/{webhook_id}/deliveries:
    parameters:
      - in: path
        name: webhook_id
        required: true
        schema: { type: integer }
    get:
      tags: [webhooks]
      summary: 回调投递历史
      x-required-permission: webhook:read
      parameters:
        - $ref: '#/components/parameters/PageParam'
        # 2026-11-12：新增 page_size。
        # 原来只有 page，且每页条数是 `20 * page`（随页码线性增长）——
        # 那个公式只在分页失效时才能"看起来对"（MP 分页插件从未注册，
        # selectPage 退化成全表查询）。分页插件补上后它会真的生效，
        # 而 offset = (page-1) * size 会算出错位的偏移（第 21~40 条被跳过）。
        # ⇒ 改成常规的 page + page_size。
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 投递历史
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookDelivery' }

  # ===== 管理员：备份与恢复（v3.1 新增）=====
  /admin/backups:
    get:
      tags: [admin]
      summary: 备份列表
      x-required-permission: admin:backup
      responses:
        '200':
          description: 备份列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Backup' }
    post:
      tags: [admin]
      summary: 触发备份
      x-required-permission: admin:backup
      description: 异步触发全量或增量备份；高危操作需多因素认证
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, mfa_code]
              properties:
                type:
                  type: string
                  enum: [full, incremental]
                description:
                  type: string
                mfa_code:
                  type: string
                  description: MFA 二次验证码
      responses:
        '202':
          description: 备份任务已接受
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup_id: { type: string }
                  task_id: { type: string }

  /admin/backups/{backup_id}/restore:
    parameters:
      - in: path
        name: backup_id
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: 从备份恢复（高危）
      x-required-permission: admin:restore
      description: |
        **高危操作**：将从备份恢复数据，会覆盖当前数据。
        需要多因素认证 + 二级审批（主管确认）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [mfa_code, approval_token]
              properties:
                mfa_code: { type: string }
                approval_token:
                  type: string
                  description: 二级审批令牌（主管通过工单系统签发）
                confirm:
                  type: boolean
                  description: 必须为 true
      responses:
        '202':
          description: 恢复任务已接受
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }


  # ===================================================================
  # 以下端点在实现中已存在，但此前契约里缺失 —— 补齐后 SDK 生成器
  # （scripts/generate-sdks.sh / generate-postman.sh）才能产出可用客户端
  # ===================================================================

  /auth/profile:
    put:
      tags: [auth]
      summary: 修改当前用户个人资料
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                phone: { type: string }
                real_name: { type: string }
      responses:
        '200':
          description: 更新后的用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'

  /auth/change-password:
    post:
      tags: [auth]
      summary: 自助修改密码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }

  /auth/sso/exchange:
    post:
      tags: [auth]
      summary: SSO 一次性登录码换 token
      description: |
        SSO 回调成功后重定向只带一个一次性 code（不带 token，避免 token
        进浏览器历史 / 反代 access log / Referer）。用该 code 换 token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 登录码无效或已使用

  # ===== WebAuthn / FIDO2（无密码登录）=====
  /auth/webauthn/register/begin:
    post:
      tags: [webauthn]
      summary: 开始注册（生成 challenge 与注册选项）
      description: |
        步骤 1/2。返回 challenge（服务端保存、后续一次性消费）、RP 信息、
        可接受的算法列表、已注册凭据（避免重复注册）与认证器选择策略。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 凭据显示名（可选）
      responses:
        '200':
          description: 注册选项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnRegistrationOptions'
        '404':
          description: 用户不存在

  /auth/webauthn/register/complete:
    post:
      tags: [webauthn]
      summary: 完成注册（校验 attestation 并存储凭据）
      description: |
        步骤 2/2。校验 challenge（一次性）与 attestation，解析公钥后落库。
        凭据以 `webauthn_credential` 表保存，支持多设备。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, credentialId, clientDataJSON]
              properties:
                challenge: { type: string }
                credentialId:
                  type: string
                  description: base64url 编码的 credential id
                attestation:
                  type: string
                  description: 客户端返回的 attestation 对象（CBOR → JSON）
                clientDataJSON: { type: string }
                name: { type: string }
      responses:
        '200':
          description: 注册结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  credentialId: { type: string, nullable: true }
        '400':
          description: challenge 过期或 attestation 校验失败

  /auth/webauthn/login/begin:
    post:
      tags: [webauthn]
      summary: 开始无密码登录（生成 challenge）
      description: |
        返回 challenge 与该工号已注册的凭据列表（allowCredentials）。
        未注册过凭据时列表为空，客户端应提示改用密码登录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeNo]
              properties:
                employeeNo: { type: string }
      responses:
        '200':
          description: 登录选项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnLoginOptions'

  /auth/webauthn/login/complete:
    post:
      tags: [webauthn]
      summary: 完成无密码登录（校验 assertion 并签发 token）
      description: |
        校验 challenge 与 assertion，签发 access_token + refresh_token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeNo, challenge, credentialId, clientDataJSON, signature]
              properties:
                employeeNo: { type: string }
                challenge: { type: string }
                credentialId: { type: string }
                authenticatorData:
                  type: string
                  description: CBOR 编码的 authenticatorData
                clientDataJSON: { type: string }
                signature: { type: string }
      responses:
        '200':
          description: 登录结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  access_token: { type: string, nullable: true }
                  refresh_token: { type: string, nullable: true }
        '400':
          description: challenge 过期或 assertion 校验失败

  /auth/webauthn/credentials:
    get:
      tags: [webauthn]
      summary: 列出当前用户的 WebAuthn 凭据
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 凭据列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    credentialId: { type: string }
                    name: { type: string, nullable: true }
                    credentialType: { type: string }
                    userVerification: { type: string, nullable: true }
                    lastUsedAt: { type: string, format: date-time, nullable: true }
                    createdAt: { type: string, format: date-time }

  /auth/webauthn/credentials/{credentialId}:
    delete:
      tags: [webauthn]
      summary: 撤销一个 WebAuthn 凭据
      description: |
        只能撤销**自己的**凭据 —— 凭据不属于当前用户时返回 404（不泄露凭据是否存在）。
        撤销是软删除（写入 revoked_at），审计日志保留痕迹。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: credentialId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: 撤销成功
        '404':
          description: 凭据不存在或不属于当前用户

  /rbac/permissions:
    get:
      tags: [permissions]
      summary: 权限目录列表
      x-required-permission: role:read or user:read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 权限列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionDTO'

  /rbac/roles:
    get:
      tags: [permissions]
      summary: 角色列表
      x-required-permission: role:read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      tags: [permissions]
      summary: 创建角色
