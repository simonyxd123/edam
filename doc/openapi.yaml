      tags: [playback]
      summary: 签发播放 token
      x-required-permission: video:read
      security:
        - bearerAuth: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 播放 token
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  m3u8_url: { type: string }
                  token: { type: string }
                  expires_at: { type: string }
                  key_url: { type: string }
                  watermark_template: { type: string }

  /playback/{video_id}/playlist.m3u8:
    get:
      tags: [playback]
      summary: HLS 播放列表
      description: |
        Hls.js 不能带 Authorization 头，所以 token 走 query string，
        服务端校验后改写分片与 AES 密钥的 URL。

        改写后的地址是**根相对路径**（/api/v1/playback/{id}/segment/...），
        由 Hls.js 用 manifest 自身的 URL 解析 —— manifest 是浏览器按同源
        拉下来的，其 origin/端口必然正确。
        （早期版本改写成绝对路径，需要后端猜浏览器侧 origin；
        nginx 的 X-Forwarded-Host 用 $host 不含端口，猜错会让分片指向
        另一个 origin，浏览器连不上 ⇒ Hls.js 收不到任何 HTTP 响应，
        前端只能报 "HTTP ???"。）
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: m3u8 内容
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        '401':
          description: token 无效
        '404':
          description: |
            播放产物在对象存储中不存在 —— 通常是视频还没转码完成
            （hls_status 仍是 pending/processing），或产物已被删除。
        '503':
          description: |
            对象存储（MinIO）暂时不可达。**与 404 区分开**：
            404 是"产物不存在"，503 是"存储服务挂了" ——
            前者提示稍后重试/联系管理员处理，后者提示稍后重试。
            运维看日志时也能据此判断该查转码流程还是查 MinIO 连通性。

  /playback/{video_id}/segment/{filename}:
    get:
      tags: [playback]
      summary: HLS 加密分片
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: filename
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 分片内容（AES-128 加密）
          content:
            video/mp2t:
              schema: { type: string, format: binary }
        '401':
          description: token 无效

  /playback/{video_id}/key:
    get:
      tags: [playback]
      summary: HLS AES-128 密钥
      description: |
        密钥由 worker 转码时随机生成，存 MinIO 的 videos/{id}/key.bin。
        Hls.js 拉 key 时不能带自定义头，所以 token 走 query string。
      parameters:
        - name: video_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 16 字节 AES-128 密钥
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          description: token 无效

  /documents/{doc_id}/preview:
    get:
      tags: [documents]
      summary: 文档预览（带动态明水印）
      x-required-permission: document:read
      description: |
        按**可见性**校验（见 /documents/batch-permission 的授权模型）：
        需要 view 位或该密级的默认可见范围，否则 403。
      security:
        - bearerAuth: []
