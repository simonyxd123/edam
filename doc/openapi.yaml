              schema:
                type: object
                properties:
                  resource_type: { type: string }
                  resource_id: { type: integer, format: int64 }
                  classification_lv: { type: string }
        '400':
          description: 密级取值非法或未填 reason
        '403':
          description: 无 classification:manage 权限

