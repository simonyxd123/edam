      description: |
        人工调整密级 —— 上传时服务端裁决只允许"往严里选"，
        这里是唯一能把密级往低调的入口。
        需要 classification:manage 权限（权限目录里已有，此前 Java 侧零引用）。
        每次调整都写 data_classification_audit（谁 / 何时 / 从什么改成什么 / 为什么），
