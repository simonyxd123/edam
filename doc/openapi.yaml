        - name: doc_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classification_lv, reason]
              properties:
                classification_lv:
                  type: string
