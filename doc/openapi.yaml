openapi: 3.0.3
info:
  title: 企业全格式数字资产防泄密系统 API
  description: |
    本文档定义企业全格式数字资产防泄密系统的 RESTful API 规范（v3.4）。

    设计原则：
    - 统一鉴权：所有 API（除登录/健康检查外）需在 Header 中携带 JWT
    - 资源命名：复数名词、kebab-case
    - 错误响应：统一 RFC 7807 Problem Details，含 trace_id
    - 分页：page-based（管理后台），cursor-based（前端列表）
    - 版本：URL 前缀 /api/v1/

    安全模型：
    - JWT 有效期 5-10 分钟，refresh token 7 天
    - RBAC + 资源级 ACL
    - 密级 L1-L4（详见 v3.0 第六章 6.3.1）

    API 版本管理策略：
    - v1 至少维护 12 个月
    - 破坏性变更发布 v2，旧版本并行运行 6 个月
    - 弃用 API 在响应头增加 `Sunset: <date>` + `Deprecation: true`
    - 客户端应在 6 个月内迁移到新版本
    - 详细变更记录：CHANGELOG.md（按语义化版本 SemVer 2.0）

    限流策略（全局）：
    - 普通接口：每用户 100 req/min、每 IP 1000 req/min
    - 写接口（POST/PUT/DELETE）：每用户 30 req/min
    - 登录接口：每 IP 5 req/min、每工号 3 req/min（详见 /auth/login）

  version: 3.4.2
  contact:
    name: 安全团队
    email: security@example.com
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: https://api.example.com/api/v1
    description: 生产环境
  - url: https://api-staging.example.com/api/v1
    description: 预发布环境
  - url: http://localhost:8092/api/v1
    description: 本地开发

tags:
  - name: auth
    description: 鉴权与会话
  - name: webauthn
    description: WebAuthn / FIDO2 无密码登录（注册与凭据管理）
  - name: health
    description: 健康检查
  - name: users
    description: 用户与角色
  - name: videos
    description: 视频资源
  - name: documents
    description: 文档资源
  - name: playback
    description: 视频播放与鉴权
  - name: preview
    description: 文档预览
  - name: permissions
    description: 权限管理
  - name: distribution
    description: 外发审批
  - name: watermarks
    description: 水印与溯源
  - name: audit
    description: 审计日志
  - name: search
    description: 全文搜索
  - name: tags
    description: 标签管理
  - name: notifications
    description: 通知与消息
  - name: webhooks
    description: 回调注册
  - name: admin
    description: 管理员接口（备份/恢复）
  - name: classification
    description: 密级管理（人工调整）

security:
  - bearerAuth: []

paths:
  # ===== 鉴权 =====
  /auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      description: |
        工号 + 密码登录，成功返回 access_token + refresh_token。

        **限流策略**：
        - 单 IP 每分钟 5 次（429 拒绝）
        - 单工号每分钟 3 次（429 拒绝）
        - 单 IP 单日 100 次后要求图形验证码（响应头 `X-Captcha-Required: true`）
        - 连续 5 次密码错误 → 账号锁定 30 分钟（需管理员解锁或工单申请）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            X-RateLimit-Limit:
              schema: { type: integer }
              description: 限流上限
            X-RateLimit-Remaining:
              schema: { type: integer }
              description: 剩余配额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token: rft_xxxxxxxxxxxx
                token_type: Bearer
                expires_in: 600
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: 账号锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: Account Locked
                status: 423
                detail: 连续登录失败过多，账号已被锁定 30 分钟
                code: AUTH_ACCOUNT_LOCKED
                trace_id: abc123def456
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 access_token
      description: |
        使用 refresh_token 换取新的 access_token。

        **refresh_token 会轮换**：响应里带回一张新的 `refresh_token`，
        客户端必须用新的替换旧的 —— 旧的那张立刻作废。
        （2026-11-07 起。此前不轮换，一张泄露的 refresh_token 能在
        整个 7 天 TTL 里无限续期，既没有失效点也没有重放检测。）

        账号被禁用（status=2）或锁定（status=3）时拒绝续期。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: refresh_token（7 天有效期，一次性使用）
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: refresh_token 无效 / 已过期 / 账号已禁用
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出
      description: 撤销当前 access_token 与 refresh_token
      responses:
        '204':
          description: 登出成功

  /auth/me:
    get:
      tags: [auth]
      summary: 获取当前用户信息
      description: |
        返回当前登录用户的基本信息（PII 字段如姓名/工号仅在此接口返回）。
        **重要**：Token 中不携带 PII，避免泄露。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'

  # ===== 用户管理 =====
  /users:
    get:
      tags: [users]
      summary: 用户列表
      x-required-permission: user:read
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - in: query
          name: dept_id
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string, enum: [active, disabled, locked] }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      tags: [users]
      summary: 创建用户
      x-required-permission: user:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{user_id}:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: { type: integer }
    get:
      tags: [users]
      summary: 用户详情
      x-required-permission: user:read
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [users]
      summary: 更新用户
      x-required-permission: user:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [users]
      summary: 软删除用户（设置 status=disabled，立即吊销密钥）
      x-required-permission: user:manage
      responses:
        '204':
          description: 删除成功

  /users/{user_id}/revoke-keys:
    post:
      tags: [users]
      summary: 立即吊销用户所有密钥
      x-required-permission: user:manage
      description: |
        用于员工离职、违规等紧急场景。

        **现在真的会吊销**（2026-11-07 修。此前这个端点是空实现 ——
        只打日志就返回 204，token 一个都没作废）：
        - 该用户全部 refresh_token 立即作废 → 他**立刻**换不到新的 access_token
        - `sys_session.revoked = 1`（DB 留痕）
        - 已签发出去的那张 access_token 是无状态 JWT，没有服务端黑名单，
          最多再存活一个 TTL（默认 10 分钟）—— 这是架构事实，不是实现缺陷
      parameters:
        - in: path
          name: user_id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: 吊销成功

  # ===== 视频资源 =====
  /videos:
    get:
      tags: [videos]
      summary: 视频资源列表
      description: |
        按**可见性**过滤（密级 + 显式授权，见 /videos/batch-permission 的授权模型）：
        L1/L2 对所有登录用户可见；L3 仅上传者、同部门、被显式授权者可见；
        L4 仅上传者与被显式授权者可见。管理员可见全部。
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - in: query
          name: classification_lv
          schema: { type: string, enum: [L1, L2, L3, L4] }
        - in: query
          name: uploader_id
          schema: { type: integer }
      responses:
        '200':
          description: 视频列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
    post:
      tags: [videos]
      summary: 上传视频
      x-required-permission: video:upload
      description: |
        上传视频文件，触发 RabbitMQ 异步处理（HLS 切片 + 帧指纹提取）。
        请求体为 multipart/form-data。

        **密级由服务端裁决**：客户端声明的 classification_lv 只是"申请值"，
        服务端会算出一条基线（文件名关键词 / 文件大小 / 上传者部门），
        最终落库的是两者中**更高**的那个 —— 客户端可以往严里选，不能往松里选。
        非法取值直接 400（不会静默降级成 L1）。响应里的 classification_lv
        是**实际落库**的值，可能高于声明值。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, classification_lv]
              properties:
                file:
                  type: string
                  format: binary
                  description: 视频文件（mp4/mov/avi 等）
                classification_lv:
                  type: string
                  enum: [L1, L2, L3, L4]
                  description: 申请的密级；服务端裁决后可能更高
                title:
                  type: string
                description:
                  type: string
                tags:
                  type: array
                  items: { type: string }
      responses:
        '202':
          description: 上传已接受，异步处理中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUploadResponse'

  /videos/{video_id}:
    parameters:
      - in: path
        name: video_id
        required: true
        schema: { type: integer }
    get:
      tags: [videos]
      summary: 视频详情
      description: |
        同样按**可见性**校验（见 /videos/batch-permission 的授权模型）：
        没有查看权限时返回 403，而不是 404 —— 403 才能让用户知道
        "需要授权"而不是"视频不存在"。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '403':
          description: 没有该视频的查看权限
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [videos]
      summary: 删除视频（仅上传者或管理员）
      x-required-permission: video:delete
      responses:
        '204':
          description: 删除成功

  # ===== 播放鉴权 =====
  # 注意：/playback/{video_id}/token 与 /playback/{video_id}/key 的定义在
  # 本文件下方「视频播放」小节（与 playlist.m3u8 / segment 放在一起），
  # 旧版本此处有过一份重复定义（描述的是过时的 X-Session-Token 头方案），
  # YAML 重复键只会保留后一份 —— 已删除，避免规范与实现各说各话。

  /playback/{video_id}/log:
    post:
      tags: [playback]
      summary: 上报播放日志
      description: |
        前端播放器周期性上报播放状态，用于审计与溯源。

        **鉴权要求**（v3.1 加强）：
        - 必须携带 JWT（继承全局 security）
        - **必须带播放 token**（`?token=`）：就是 `POST /playback/{id}/token`
          签发的那张，服务端校验四件事 ——
          ① token 有效且绑定到本视频；
          ② token 的 subject 就是当前用户（不能用别人的 token 冒名上报）；
          ③ 请求体里的 `session_id` 与 token 里的 `session_id` 一致；
          ④ 该用户此刻仍看得到这个视频（授权被撤销也要挡住）。
        - 频率限制：每用户每分钟 60 次（429 拒绝）
        - 失败重试：客户端使用指数退避，避免雪崩
        - **安全警示**：此接口是溯源系统的审计通道，未授权或异常请求将触发告警

        > 2026-11-14 代码审计第五轮：此前服务端只校验"session_id 非空"，
        > 其余（session_id / event / progress_sec）全部由客户端提供 ⇒
        > `play_log`（溯源链最后一环，留 365 天）是一张可以随手伪造的表。
        > 契约里"session_id 必须匹配 active session"这句话当时**只存在于本文档里**。
      parameters:
        - in: path
          name: video_id
          required: true
          schema: { type: integer }
        - in: query
          name: token
          required: true
          description: 播放 token（`POST /playback/{video_id}/token` 签发，10 分钟有效）
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, event]
              properties:
                session_id:
                  type: string
                  description: 会话 ID（与 JWT 中的 session 绑定）
                event:
                  type: string
                  enum: [start, progress, pause, end, error, screenshot_detected]
                timestamp:
                  type: string
                  format: date-time
                progress_sec:
                  type: integer
      responses:
        '204':
          description: 上报成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ===== 文档资源 =====
  /documents:
    get:
      tags: [documents]
      summary: 文档资源列表
      description: |
        按**可见性**过滤（密级 + 显式授权，见 /documents/batch-permission 的授权模型）：
        L1/L2 对所有登录用户可见；L3 仅上传者、同部门、被显式授权者可见；
        L4 仅上传者与被显式授权者可见。管理员可见全部。
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - in: query
          name: classification_lv
          schema: { type: string, enum: [L1, L2, L3, L4] }
        - in: query
          name: file_type
          schema: { type: string, enum: [docx, pdf, xlsx, pptx, image] }
      responses:
        '200':
          description: 文档列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
    post:
      tags: [documents]
      summary: 上传文档
      x-required-permission: document:upload
      description: |
        触发 RabbitMQ 异步任务（频域盲水印 + 格式转换）

        **密级由服务端裁决**：客户端声明的 classification_lv 只是"申请值"，
        服务端会算出一条基线（文件名关键词 / 文件大小 / 上传者部门），
        最终落库的是两者中**更高**的那个 —— 客户端可以往严里选，不能往松里选。
        非法取值直接 400（不会静默降级成 L1）。响应里的 classification_lv
        是**实际落库**的值，可能高于声明值。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, classification_lv]
              properties:
                file:
                  type: string
                  format: binary
                classification_lv:
                  type: string
                  enum: [L1, L2, L3, L4]
                  description: 申请的密级；服务端裁决后可能更高
                title: { type: string }
                enable_watermark:
                  type: boolean
                  default: true
      responses:
        '202':
          description: 上传已接受
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'

  /documents/{doc_id}:
    parameters:
      - in: path
        name: doc_id
        required: true
        schema: { type: integer }
    get:
      tags: [documents]
      summary: 文档详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [documents]
      summary: 删除文档
      x-required-permission: document:delete
      responses:
        '204':
          description: 删除成功

  # ===== 文档预览 =====
  /preview/{doc_id}:
    get:
      tags: [preview]
      summary: 文档预览（含 Canvas 动态明水印）
      x-required-permission: document:read
      parameters:
        - in: path
          name: doc_id
          required: true
          schema: { type: integer }
        - in: query
          name: format
          schema: { type: string, enum: [html, pdf_preview, image_per_page] }
      responses:
        '200':
          description: 预览 HTML（含水印）
          content:
            text/html:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /preview/{doc_id}/download:
    get:
      tags: [preview]
      summary: 下载已加密文档
      description: |
        下载文档必须通过文档外发网关，返回的文档：
        - 加密（AES-256）
        - 含 Canvas 动态明水印
        - 含频域盲水印（如启用）
      parameters:
        - in: path
          name: doc_id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 加密文档下载
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: |
            没有该文档的下载权限。
            下载权与可见性**分开**（方案书 5.6.1【例外】"L1 公开资源允许下载；
            L2-L4 默认禁止"）—— L2 文档是"能预览但不能下载"。

  # ===== 权限管理 =====
  # 注意：/rbac/permissions 与 /rbac/roles 的完整定义在下方「角色与权限管理」
  # 小节（含 POST/PUT/DELETE 与 security 声明）；此处原有的一份重复定义只覆盖
  # GET 且引用的 schema 名与实际 DTO 不符，已删除。

  /rbac/users/{user_id}/permissions:
    parameters:
      - in: path
        name: user_id
        required: true
        schema: { type: integer }
    get:
      tags: [permissions]
      summary: 用户的有效权限（含 RBAC + 资源 ACL）
      x-required-permission: user:read or role:read
      responses:
        '200':
          description: 权限列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EffectivePermission'

  # ===== 外发审批 =====
  /distribution/approvals:
    get:
      tags: [distribution]
      summary: 外发审批列表
      x-required-permission: distribution:read
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected, expired, revoked] }
        - in: query
          name: applicant_id
          schema: { type: integer }
        - in: query
          name: approver_id
          schema: { type: integer }
      responses:
        '200':
          description: 审批列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
    post:
      tags: [distribution]
      summary: 发起外发审批
      x-required-permission: distribution:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCreate'
      responses:
        '201':
          description: 审批发起成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'

  /distribution/approvals/{approval_id}:
    parameters:
      - in: path
        name: approval_id
        required: true
        schema: { type: integer }
    get:
      tags: [distribution]
      summary: 审批详情
      x-required-permission: distribution:read
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'

  /distribution/approvals/{approval_id}/decisions:
    parameters:
      - in: path
        name: approval_id
        required: true
        schema: { type: integer }
    get:
      tags: [distribution]
      summary: 审批决策流水
      x-required-permission: distribution:read
      description: |
        审批单主表只保留**当前状态**；这张流水表保留**历史** ——
        谁批的、什么时候批的、批语是什么。

        外发审批是"把资产送到公司外面"这道闸，闸门每次开合都必须留痕。
      responses:
        '200':
          description: 决策流水列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval_id: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        approval_id: { type: integer }
                        approver_id: { type: integer }
                        decision: { type: string, enum: [approve, reject] }
                        comment: { type: string, nullable: true }
                        decided_at: { type: string, nullable: true }

  /distribution/approvals/{approval_id}/decide:
    post:
      tags: [distribution]
      summary: 审批决策
      x-required-permission: distribution:approve
      description: |
        决策会写一条 `distribution_approval_decision` 流水（谁 / 何时 / 批语）。

        三条硬约束：
        - **状态机**：只有 `pending` 的单子能决策；已处理过的再提交返回 409。
        - **不可自审自批**：审批人不能是申请人本人，否则 403。
        - **驳回必填理由**：`decision=reject` 时 `comment` 不能为空，否则 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                comment:
                  type: string
      responses:
        '200':
          description: 决策成功
        '409':
          description: 状态不允许（已处理过）
        '403':
          description: 自审自批被拒

  /distribution/approvals/{approval_id}/revoke:
    post:
      tags: [distribution]
      summary: 撤销已审批的外发（紧急情况）
      x-required-permission: distribution:approve
      description: |
        状态机：只有 `pending` / `approved` 的单子能撤销；
        已驳回 / 已过期 / 已撤销的返回 409。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '204':
          description: 撤销成功
        '409':
          description: 状态不允许撤销

  # ===== 水印与溯源 =====
  /watermarks/extract:
    post:
      tags: [watermarks]
      summary: 提取水印/指纹
      x-required-permission: watermark:read
      description: |
        上传疑似泄露文件，提取水印或帧指纹，定位泄密者。

        **提取由 Worker 执行**（盲水印算法在 Python 侧），
        后端把文件字节转发给 Worker 的 `/internal/watermark/extract`。

        三种结果必须分清：
        - 提取到水印 → `extracted.fingerprint` 有值，`matched_users` 给出
          匹配到的文档与上传者
        - 文件里没有水印 → `extracted.extracted=false`（**这是有效结论**）
        - 提取过程失败（Worker 不可达 / 算法缺失 / 文件损坏）→ **503**，
          绝不伪装成"没查到泄露"

        当前支持 `image` / `pdf`；`video` / `docx` / `xlsx` 会明确报 400
        （帧指纹比对与 Office 隐写提取尚未接线）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [image, pdf, video, docx, xlsx]
      responses:
        '200':
          description: 提取完成（是否提取到水印见 extracted 字段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatermarkExtractResult'
        '400':
          description: 文件为空，或类型不支持
        '503':
          description: Worker 不可用（未配置 WORKER_BASE_URL / 连不上 / 提取出错）

  /watermarks/cache:
    get:
      tags: [watermarks]
      summary: 水印缓存查询
      parameters:
        - in: query
          name: resource_id
          required: true
          schema: { type: integer }
        - in: query
          name: resource_type
          required: true
          schema: { type: string, enum: [video, document] }
      responses:
        '200':
          description: 缓存命中情况
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatermarkCacheEntry'

  /watermarks/cache/{cache_id}:
    delete:
      tags: [watermarks]
      summary: 清除水印缓存（资源权限变更时）
      x-required-permission: watermark:manage
      parameters:
        - in: path
          name: cache_id
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: 清除成功

  # ===== 审计日志 =====
  /audit/logs:
    get:
      tags: [audit]
      summary: 操作日志查询
      x-required-permission: audit:read
      parameters:
        - in: query
          name: user_id
          schema: { type: integer }
        - in: query
          name: operation_type
          schema: { type: string }
        - in: query
          name: start_time
          schema: { type: string, format: date-time }
        - in: query
          name: end_time
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 日志列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'

  /audit/logs/operation-types:
    get:
      tags: [audit]
      summary: 可查询的操作类型枚举
      x-required-permission: audit:read
      description: |
        返回 `operation_log.operation_type` 的全部规范值（含历史别名归并后的结果）。

        前端「操作类型」下拉框优先取本接口，取不到再退回本地常量 ——
        后端加新的操作类型时，前端不用跟着改代码。
      responses:
        '200':
          description: 操作类型列表
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /audit/logs/resource-types:
    get:
      tags: [audit]
      summary: 可查询的资源类型枚举
      x-required-permission: audit:read
      description: |
        返回 `operation_log.resource_type` 的全部取值（video / document / system …）。
      responses:
        '200':
          description: 资源类型列表
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /audit/logs/{log_id}:
    get:
      tags: [audit]
      summary: 日志详情
      x-required-permission: audit:read
      parameters:
        - in: path
          name: log_id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'

  /audit/logs/export:
    post:
      tags: [audit]
      summary: 导出日志（CSV）
      x-required-permission: audit:audit_export
      description: |
        导出审计日志，**同步**返回 CSV 文件（UTF-8 BOM，Excel 直接可开）。

        **为什么是同步而不是异步**（2026-11-08 改）：契约里原本写的是
        "异步生成 + 签名 URL 下载"，但仓库里**没有任何导出任务机制**
        （没有任务表、没有调度器）—— 实现只是返回了一个指向
        `https://api.example.com/api/v1/audit/exports/...` 的**伪造 URL**，
        点开永远是 404。与其留一个骗人的异步接口，不如同步导：
        单次上限 50000 行，超过就返回 400 要求缩小时间范围。

        **MFA 二次校验**：操作者开了 MFA 时必须带 `mfa_code`
        （导出审计日志 ≈ 搬走全公司的行为画像）。

        过滤口径与 `GET /audit/logs` **完全一致**（同一个查询构造）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_time: { type: string, description: 'yyyy-MM-dd HH:mm:ss' }
                end_time: { type: string, description: 'yyyy-MM-dd HH:mm:ss' }
                mfa_code:
                  type: string
                  description: MFA 动态令牌（操作者开了 MFA 时必填）
                filter:
                  type: object
                  description: 过滤条件（user_id / operation_type / result / resource_type）
                  properties:
                    user_id: { type: integer }
                    operation_type: { type: string }
                    result: { type: string, enum: [success, failure, denied] }
                    resource_type: { type: string }
      responses:
        '200':
          description: 导出文件（CSV）
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="audit-export-<ts>.csv"'
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: MFA 校验失败 / 时间格式非法 / 超过 50000 行上限
        '403':
          description: 没有 audit:audit_export 权限

  # ===== 健康检查（v3.1 细化）=====
  /health:
    get:
      tags: [health]
      summary: 总体健康检查（兼容旧版）
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
        '503':
          description: 服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /health/live:
    get:
      tags: [health]
      summary: K8s liveness 探针
      description: |
        仅判断进程是否存活；不检查依赖。
        K8s 配置：livenessProbe httpGet /health/live
      security: []
      responses:
        '200':
          description: 存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: alive }
                  uptime_sec: { type: integer }
                  pid: { type: integer }

  /health/ready:
    get:
      tags: [health]
      summary: K8s readiness 探针
      description: |
        检查应用是否准备好接收流量（含依赖健康）。
        K8s 配置：readinessProbe httpGet /health/ready

        **503 的判定**：MySQL 不可用时返回 503 —— K8s 的 httpGet 探针只看
        HTTP 状态码（不看 body），所以必须真的返回 503 才能把这个 Pod 从
        Endpoints 摘掉。Redis / RabbitMQ 是共享依赖，故障时只降级为
        `degraded` 并保持 200（把所有副本一起摘出去救不回共享组件，
        反而把局部故障放大成整体不可用）。

        503 的响应体**依然携带** `admin_bootstrap` —— 运维排查"服务起来了
        但登不进去"时最需要的就是这个字段，它不能随 503 一起消失。
      security: []
      responses:
        '200':
          description: 就绪（status = ok 或 degraded）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
        '503':
          description: 未就绪（MySQL 不可用，status = down）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /health/components:
    get:
      tags: [health]
      summary: 各依赖组件健康状态
      description: |
        详细返回 MySQL、Redis、MinIO、Vault、RabbitMQ 等依赖的状态。
        管理员使用，含敏感信息（如 DB 连接池统计），**需要 JWT 鉴权**。

        与 /health/ready 的区别：这里做全量探测（含 MinIO / Vault），耗时更高；
        ready 只做决定"能不能接流量"所需的那几个。
      responses:
        '200':
          description: 详细健康状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentsHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===== WebSocket 实时通知（v3.1 新增）=====
  /ws/notifications:
    get:
      tags: [notifications]
      summary: WebSocket 长连接（实时通知）
      description: |
        客户端通过 WebSocket 连接到 `/ws/notifications?token=<JWT>`，接收实时推送：
        - 外发审批结果（approval.decided）
        - 密钥吊销告警（key.revoked）
        - 驱动心跳异常（driver.offline）
        - 合规事件（compliance.alert）
        - 系统公告（system.broadcast）

        **协议**：WebSocket over TLS（WSS）
        **心跳**：客户端每 30s 发送 ping，服务端响应 pong
        **重连**：客户端断线后按指数退避重连（最大 5 分钟）
        **消息格式**：JSON `{"type": "...", "data": {...}, "ts": "..."}`
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
          description: JWT（作为查询参数传入，因为浏览器 WebSocket API 不支持自定义 Header）
      responses:
        '101':
          description: 升级为 WebSocket
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===== 批量操作（v3.1 新增）=====
  /videos/batch-delete:
    post:
      tags: [videos]
      summary: 批量删除视频
      x-required-permission: video:delete
      description: 管理员批量删除视频（最多 100 个），异步触发清理任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [video_ids, reason]
              properties:
                video_ids:
                  type: array
                  items: { type: integer }
                  maxItems: 100
                reason:
                  type: string
                  minLength: 10
      responses:
        '202':
          description: 任务已接受
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  affected_count: { type: integer }

  /videos/batch-permission:
    post:
      tags: [videos]
      summary: 批量授权
      x-required-permission: video:share
      description: |
        给多个用户批量授权视频访问权限（落库到 video_permission）。

        **授权模型**：
        - `actions` 是位掩码：1=view 2=download 4=edit 8=delete 16=distribute（再分享）。
        - 同一 (video_id, user_id) 唯一 ⇒ 再次授权是**覆盖**而不是叠加。
        - `expire_at` 为空 = 永不过期；非空则到期后该条授权自动失效。
        - 只有**上传者本人、管理员、或持有 distribute 位**的人才能调用本接口
          （方案书 5.4「越权分享自动阻断」）。
        - **不能授出自己没有的权限**（2026-11-13 整改）：要授出的位必须是授权人
          自己持有的位的子集，有效期也不得晚于授权人自己那份的到期时间。
          拿着 `view|distribute` 的人**不能**授出全部权限 ——
          那是"拿着别人的授权去扩大授权范围"。越权 ⇒ 403。

        **可见性 = 密级 + 显式授权**（方案书 6.3.1）：
        L1 公开 / L2 内部 = 任何登录用户可见；
        L3 机密 = 上传者、同部门、或被显式授权；
        L4 绝密 = 上传者或被显式授权（"少数核心人员"）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [video_id, user_ids, actions]
              properties:
                video_id: { type: integer }
                user_ids:
                  type: array
                  items: { type: integer }
                  maxItems: 200
                actions:
                  type: integer
                  description: 位掩码：1=view 2=download 4=edit 8=delete 16=distribute
                expire_at:
                  type: string
                  format: date-time
                  description: 授权过期时间；省略 = 永不过期
      responses:
        '200':
          description: 授权成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  granted_count: { type: integer }
                  video_id: { type: integer }
                  actions: { type: integer }
                  expire_at: { type: string, format: date-time }
        '400':
          description: 参数不合法（user_ids 为空、actions 为 0 或含未知位）
        '403':
          description: |
            无权分享该视频 —— 以下任一情况：
            - 不是上传者 / 管理员，且没有 distribute 位；
            - 要授出的权限位超出了授权人自己持有的位（越权转授）；
            - 要授出的有效期晚于授权人自己那份额权的到期时间。
    delete:
      tags: [videos]
      summary: 批量撤销授权
      x-required-permission: video:share
      description: |
        撤销（删除 video_permission 里对应的行）⇒ 对方回到"没有显式授权"。
        权限要求与授权相同：能再分享才能撤销。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [video_id, user_ids]
              properties:
                video_id: { type: integer }
                user_ids:
                  type: array
                  items: { type: integer }
                  maxItems: 200
      responses:
        '200':
          description: 撤销成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked_count: { type: integer }
                  video_id: { type: integer }
        '403':
          description: 无权撤销该视频的授权
    get:
      tags: [videos]
      summary: 查询视频的授权列表
      x-required-permission: video:share
      description: 列出该视频当前所有授权（含过期未清理的，expire_at 为空表示永不过期）
      parameters:
        - name: video_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 授权列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  video_id: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: integer }
                        actions: { type: integer }
                        granted_by: { type: integer }
                        granted_at: { type: string, format: date-time }
                        expire_at: { type: string, format: date-time }
        '403':
          description: 无权查看该视频的授权列表

  /documents/batch-delete:
    post:
      tags: [documents]
      summary: 批量删除文档
      x-required-permission: document:delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_ids, reason]
              properties:
                doc_ids:
                  type: array
                  items: { type: integer }
                  maxItems: 100
                reason:
                  type: string
      responses:
        '202':
          description: 任务已接受

  /documents/batch-permission:
    post:
      tags: [documents]
      summary: 批量授权
      x-required-permission: document:share
      description: |
        给多个用户批量授权文档访问权限（落库到 doc_permission）。

        **授权模型**（依据 doc/database_schema.md §3.2）：
        - `actions` 位掩码：1=view 2=download 4=edit 8=delete 16=distribute **32=print**。
        - 同一 (doc_id, user_id) 唯一 ⇒ 再次授权是**覆盖**而不是叠加。
        - `expire_at` 为空 = 永不过期；非空则到期后该条授权自动失效。
        - 只有**上传者本人、管理员、或持有 distribute 位**的人才能调用本接口。
        - **不能授出自己没有的权限**（2026-11-13 整改）：要授出的位必须是授权人
          自己持有的位的子集，有效期也不得晚于授权人自己那份的到期时间。
          拿着 `view|distribute` 的人**不能**授出全部权限 ——
          那是"拿着别人的授权去扩大授权范围"。越权 ⇒ 403。

        **可见性 = 密级 + 显式授权**（方案书 6.3.1）：
        L1/L2 对所有登录用户可见；L3 上传者+同部门+被授权；L4 上传者+被授权。

        **下载权与可见性分开**（方案书 5.6.1【例外】"L1 公开资源允许下载；L2-L4 默认禁止"）：
        L2 文档是"能看但不能下"；下载要么是 L1，要么显式授予 download 位。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_id, user_ids, actions]
              properties:
                doc_id: { type: integer }
                user_ids:
                  type: array
                  items: { type: integer }
                  maxItems: 200
                actions:
                  type: integer
                  description: 位掩码：1=view 2=download 4=edit 8=delete 16=distribute 32=print
                expire_at:
                  type: string
                  format: date-time
                  description: 授权过期时间；省略 = 永不过期
      responses:
        '200':
          description: 授权成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  granted_count: { type: integer }
                  doc_id: { type: integer }
                  actions: { type: integer }
                  expire_at: { type: string, format: date-time }
        '400':
          description: 参数不合法（user_ids 为空、actions 为 0 或含未知位）
        '403':
          description: |
            无权分享该文档 —— 以下任一情况：
            - 不是上传者 / 管理员，且没有 distribute 位；
            - 要授出的权限位超出了授权人自己持有的位（越权转授）；
            - 要授出的有效期晚于授权人自己那份额权的到期时间。
    delete:
      tags: [documents]
      summary: 批量撤销授权
      x-required-permission: document:share
      description: 撤销（删除 doc_permission 里对应的行）⇒ 对方回到"没有显式授权"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_id, user_ids]
              properties:
                doc_id: { type: integer }
                user_ids:
                  type: array
                  items: { type: integer }
                  maxItems: 200
      responses:
        '200':
          description: 撤销成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked_count: { type: integer }
                  doc_id: { type: integer }
        '403':
          description: 无权撤销该文档的授权
    get:
      tags: [documents]
      summary: 查询文档的授权列表
      x-required-permission: document:share
      parameters:
        - name: doc_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 授权列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  doc_id: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: integer }
                        actions: { type: integer }
                        granted_by: { type: integer }
                        granted_at: { type: string, format: date-time }
                        expire_at: { type: string, format: date-time }
        '403':
          description: 无权查看该文档的授权列表

