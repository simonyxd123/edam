                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocResource'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  query: { type: string }
                  took_ms: { type: integer }

  /dashboard/stats:
    get:
      tags: [dashboard]
      summary: 仪表盘统计
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 统计数据
          content:
            application/json:
              schema:
                type: object

  /v2/videos:
    get:
      tags: [videos]
      summary: 视频列表（cursor 分页）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          description: 上一页返回的游标
          schema: { type: string }
        - name: classification_lv
          in: query
          schema: { type: string }
        - name: uploader_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VideoResource'
                  has_more: { type: boolean }
                  next_cursor: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      in: query
      name: page
      schema: { type: integer, default: 1, minimum: 1 }
    PageSizeParam:
      in: query
      name: page_size
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 请求过于频繁
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ===== 通用 =====
    Error:
      type: object
      required: [type, title, status, trace_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 业务错误码 }
        trace_id:
          type: string
          description: |
            服务端追踪 ID（与日志关联）。
            用户报告问题时附带此 ID，可快速定位服务端日志。

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: |
            ok = 依赖全好；degraded = 共享依赖故障（仍能接流量）；
            down = MySQL 不可用（不能接流量）。
        version: { type: string, description: 服务版本 }
        uptime_sec: { type: integer }
        timestamp: { type: string, format: date-time }
        components:
          type: object
          description: 决定就绪与否的那几个依赖的明细
          properties:
            mysql:
              type: object
              properties:
                status: { type: string, enum: [ok, down] }
                latency_ms: { type: integer }
            redis:
              type: object
              properties:
                status: { type: string, enum: [ok, down] }
                latency_ms: { type: integer }
            rabbitmq:
              type: object
              properties:
                status: { type: string, enum: [ok, down] }
                latency_ms: { type: integer }
        admin_bootstrap:
          type: string
          enum: [not-run, ok, failed]
          description: |
            初始管理员自举状态。failed = 服务起来了但没人能登录
            （生产 profile 不阻断启动，所以这个字段是排查"服务正常但登不进去"的
            唯一线索 —— 503 时也必须带上）。
        admin_bootstrap_error:
          type: string
          description: 自举失败的原始原因（仅 admin_bootstrap=failed 时出现）
        worker_callback:
          type: object
          description: |
            Worker 回调通道的配置状态。

            **刻意不影响 HTTP 状态码**：后端本身完全能服务，只是 worker 的
            回调进不来 —— 让整个后端 503 反而是过度反应。

            没有它的话，"回调通道没通"这件事**不会**让后端变红，只在 worker
            那边表现为"转码完成了但状态没更新"，最后变成用户点播放还是 404。
            裸机部署最容易漏配这个（K8s 侧两边都从同一个 secret 取
            worker-token，裸机侧没人管）。
          properties:
            token_configured:
              type: boolean
              description: 后端是否配了 edam.worker.token（空 = 一律拒绝回调）
            status:
              type: string
              enum: [ok, misconfigured]
            hint:
              type: string
              description: 仅 status=misconfigured 时出现，说明该怎么改

    ComponentsHealth:
      type: object
      properties:
        overall:
          type: string
          enum: [ok, degraded, down]
        timestamp: { type: string, format: date-time }
        components:
          type: object
          properties:
            mysql:
              type: object
              properties:
                status: { type: string, enum: [ok, down] }
                latency_ms: { type: integer }
                pool_active: { type: integer, description: 当前活跃连接数 }
                pool_idle: { type: integer }
            redis:
              type: object
              properties:
                status: { type: string, enum: [ok, down] }
                latency_ms: { type: integer }
                memory_used_mb: { type: integer }
            minio:
              type: object
              properties:
                status: { type: string, enum: [ok, down] }
                latency_ms: { type: integer }
                disk_used_gb: { type: integer }
            vault:
              type: object
              properties:
                status: { type: string, enum: [ok, degraded, down] }
                latency_ms: { type: integer }
                sealed: { type: boolean, description: Vault 是否已封存 }
            rabbitmq:
              type: object
              properties:
                status: { type: string, enum: [ok, down] }
                latency_ms: { type: integer }
                queue_depth: { type: integer }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    # ===== 资源 =====
    # 对应后端 model/VideoResource.java，字段名为 snake_case
    # （类上挂了 @JsonNaming(SnakeCaseStrategy)，否则前端拿到的全是 undefined）。
    VideoResource:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        file_hash: { type: string }
        minio_path: { type: string }
        duration_sec: { type: integer, description: 时长（秒），来自 ffprobe }
        size_bytes: { type: integer, format: int64 }
        mime_type: { type: string }
        classification_lv:
          type: integer
          description: 密级 1=L1 公开 2=L2 内部 3=L3 机密 4=L4 绝密
        uploader_id: { type: integer }
        upload_time: { type: string, format: date-time }
        hls_status:
          type: integer
          description: 0=pending 1=processing 2=ready 3=failed
        hls_path: { type: string, nullable: true }
        fingerprint_status: { type: integer }
        fingerprint_path: { type: string, nullable: true }
        key_id: { type: integer, nullable: true }
        view_count: { type: integer }
        updated_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }

    # 对应后端 model/DocResource.java
    DocResource:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        file_type:
          type: string
          enum: [docx, pdf, xlsx, pptx, image]
        file_hash: { type: string }
        minio_path: { type: string }
        preview_path: { type: string, nullable: true }
        size_bytes: { type: integer, format: int64 }
        mime_type: { type: string }
        classification_lv: { type: integer }
        uploader_id: { type: integer }
        upload_time: { type: string, format: date-time }
        watermark_status:
          type: integer
          description: 0=pending 1=processing 2=ready 3=failed 4=skipped
        preview_status:
          type: integer
          description: 0=pending 1=processing 2=ready 3=failed
        encrypted: { type: integer, description: 1=已加密存储 }
        key_id: { type: integer, nullable: true }
        view_count: { type: integer }
        deleted_at: { type: string, format: date-time, nullable: true }

    # ===== 鉴权 =====
    LoginRequest:
      type: object
      required: [employee_no, password]
      properties:
        employee_no:
          type: string
          description: 工号
        password:
          type: string
          format: password
        mfa_code:
          type: string
          description: 多因素认证码（L3+ 资源访问必须）

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT（5-10 分钟）
        refresh_token:
          type: string
          description: refresh_token（7 天）
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: 过期秒数 }

    CurrentUser:
      type: object
      properties:
        user_id: { type: integer }
        employee_no: { type: string }
        real_name:
          type: string
          description: 真实姓名（PII）
        dept_id: { type: integer }
        dept_name: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        last_login_time: { type: string, format: date-time }

    # ===== 用户 =====
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        employee_no: { type: string }
        real_name: { type: string }
        email: { type: string, format: email }
        dept_id: { type: integer }
        status:
          type: string
          enum: [active, disabled, locked]
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [username, employee_no, real_name, password, dept_id]
      properties:
        username: { type: string }
        employee_no: { type: string }
        real_name: { type: string }
        email: { type: string }
        password: { type: string, format: password }
        dept_id: { type: integer }
        role_ids:
          type: array
          items: { type: integer }

    UserUpdate:
      type: object
      properties:
        real_name: { type: string }
        email: { type: string }
        dept_id: { type: integer }
        status: { type: string, enum: [active, disabled, locked] }
        role_ids:
          type: array
          items: { type: integer }

    UserListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ===== 视频 =====
    Video:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        file_hash: { type: string }
        duration_sec: { type: integer }
        size_bytes: { type: integer }
        classification_lv: { type: string, enum: [L1, L2, L3, L4] }
        uploader_id: { type: integer }
        upload_time: { type: string, format: date-time }
        hls_status:
          type: string
          enum: [pending, processing, ready, failed]
        fingerprint_status:
          type: string
          enum: [pending, processing, ready, failed]
        tags:
          type: array
          items: { type: string }

    VideoUploadResponse:
      type: object
      properties:
        video_id: { type: integer }
        file_hash: { type: string }
        classification_lv:
          type: string
          enum: [L1, L2, L3, L4]
          description: |
            **实际落库**的密级。服务端会做裁决（客户端只能往严里选，
            不能往松里选），所以它可能高于请求里声明的值 —— 前端要据此提示用户。
        hls_status: { type: string, example: pending }
        fingerprint_status: { type: string, example: pending }
        estimated_processing_sec: { type: integer }

    VideoListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Video' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    PlaybackToken:
      type: object
      properties:
        session_id:
          type: string
          description: 会话 ID（用于密钥接口绑定）
        m3u8_url:
          type: string
          description: HLS 播放列表 URL（已签名）
        token:
          type: string
          description: Secure Link token（md5/sha256）
        expires_at:
          type: string
          format: date-time
        key_url:
          type: string
          description: 密钥获取 URL
        watermark_template:
          type: string
          description: 水印模板（前端 Canvas 渲染）

    # ===== 文档 =====
    Document:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        file_type:
          type: string
          enum: [docx, pdf, xlsx, pptx, image]
        file_hash: { type: string }
        size_bytes: { type: integer }
        classification_lv: { type: string, enum: [L1, L2, L3, L4] }
        uploader_id: { type: integer }
        upload_time: { type: string, format: date-time }
        watermark_status:
          type: string
          enum: [pending, processing, ready, failed, skipped]
        preview_status:
          type: string
          enum: [pending, processing, ready, failed]

    DocumentUploadResponse:
      type: object
      properties:
        doc_id: { type: integer }
        file_hash: { type: string }
        classification_lv:
          type: string
          enum: [L1, L2, L3, L4]
          description: |
            **实际落库**的密级。服务端会做裁决（客户端只能往严里选，
            不能往松里选），所以它可能高于请求里声明的值 —— 前端要据此提示用户。
        watermark_status: { type: string }
        preview_status: { type: string }

    DocumentListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ===== WebAuthn =====
    WebAuthnRegistrationOptions:
      type: object
      properties:
        challenge: { type: string }
        rpId: { type: string }
        rpName: { type: string }
        userId: { type: string, description: base64url 编码的工号 }
        userName: { type: string }
        userDisplayName: { type: string }
        timeout: { type: integer, format: int64 }
        pubKeyCredParams:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: 'public-key' }
              alg: { type: integer }
        excludeCredentials:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: 'public-key' }
              id: { type: string }
        authenticatorSelection:
          type: object
          properties:
            residentKey: { type: string }
            userVerification: { type: string }
            authenticatorAttachment: { type: string, nullable: true }
        attestation: { type: string }
        userVerification: { type: string }

    WebAuthnLoginOptions:
      type: object
      properties:
        challenge: { type: string }
        rpId: { type: string }
        timeout: { type: integer, format: int64 }
        allowCredentials:
          type: array
          items: { type: string }
        userVerification: { type: string }

    # ===== 权限 =====

    # action 与 description 是权限目录的关键字段 —— 普通员工的只读白名单
    # 就是按 action='read' 划定的（见 EmployeePermissions.READ_ONLY）。
    PermissionDTO:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: 'video:read' }
        name: { type: string }
        resource_type: { type: string, example: 'video' }
        action:
          type: string
          description: 动作类型
          enum: [read, upload, edit, delete, download, print, share, approve, manage, audit_export]
        description: { type: string, nullable: true }

    Role:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: 'dept_manager' }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }

    EffectivePermission:
      type: object
      properties:
        resource_type: { type: string }
        resource_id: { type: integer, nullable: true }
        actions:
          type: array
          items:
            type: string
            enum: [view, download, edit, delete, distribute, print]
        source:
          type: string
          enum: [rbac, acl, default]
        expire_time:
          type: string
          format: date-time
          nullable: true

    # ===== 外发审批 =====
    Approval:
      type: object
      properties:
        id: { type: integer }
        doc_id: { type: integer }
        applicant_id: { type: integer }
        applicant_name: { type: string }
        external_recipient:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
            org: { type: string }
        reason:
          type: string
          description: 外发理由
        valid_hours:
          type: integer
          description: 有效期（小时）
        max_open_count:
          type: integer
          description: 最大打开次数
        allow_forward: { type: boolean }
        allow_print: { type: boolean }
        status:
          type: string
          enum: [pending, approved, rejected, expired, revoked]
        decisions:
          type: array
          items:
            type: object
            properties:
              approver_id: { type: integer }
              approver_name: { type: string }
              decision: { type: string, enum: [approve, reject] }
              comment: { type: string }
              decided_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        decided_at:
          type: string
          format: date-time
          nullable: true

    ApprovalCreate:
      type: object
      required: [doc_id, external_recipient, reason, valid_hours]
      properties:
        doc_id: { type: integer }
        external_recipient:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            org: { type: string }
        reason:
          type: string
          minLength: 10
          description: 外发理由（不少于 10 字）
        valid_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: 有效期（1 小时-30 天）
        max_open_count:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        allow_forward: { type: boolean, default: false }
        allow_print: { type: boolean, default: false }

    ApprovalListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Approval' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ===== 水印 =====
    WatermarkExtractResult:
      type: object
      properties:
        type:
          type: string
          enum: [image, pdf, video, docx, xlsx]
        extracted:
          type: object
          description: 提取到的内容
          properties:
            employee_no: { type: string }
            extract_time: { type: string, format: date-time }
            fingerprint:
              type: string
              description: 帧指纹哈希
            confidence:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: 提取置信度
        matched_users:
          type: array
          description: 匹配到的可疑用户
          items:
            type: object
            properties:
              user_id: { type: integer }
              employee_no: { type: string }
              real_name: { type: string }
              match_score: { type: number, format: float }
              match_time:
                type: string
                format: date-time
                description: 该用户访问资源的时间

    WatermarkCacheEntry:
      type: object
      properties:
        cache_id: { type: integer }
        resource_id: { type: integer }
        resource_type: { type: string }
        user_id_hash: { type: string }
        fingerprint: { type: string }
        created_at: { type: string, format: date-time }
        ttl_sec: { type: integer }
        hit_count: { type: integer }

    # ===== 审计 =====
    AuditLog:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        user_employee_no: { type: string }
        operation_type:
          type: string
          enum:
            - login
            - logout
            - view
            - download
            - upload
            - delete
            - distribute
            - approve
            - reject
            - revoke_keys
            - watermark_extract
        resource_type:
          type: string
          enum: [video, document, system, none]
        resource_id: { type: integer, nullable: true }
        ip: { type: string }
        user_agent: { type: string }
        result:
          type: string
          enum: [success, failure, denied]
        detail:
          type: string
          description: JSON 详情
        timestamp: { type: string, format: date-time }

    AuditLogListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ===== 标签（v3.1 新增）=====
    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string, description: URL 友好的英文代号 }
        type:
          type: string
          enum: [video, document, both]
        color: { type: string, description: 显示颜色（hex） }
        use_count: { type: integer }

    TagCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 2, maxLength: 32 }
        code: { type: string, pattern: '^[a-z0-9-]+$' }
        type:
          type: string
          enum: [video, document, both]
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }

    # ===== 通知（v3.1 新增）=====
    Notification:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        type:
          type: string
          enum: [approval, key_alert, driver_alert, compliance, system]
        title: { type: string }
        content: { type: string }
        related_resource_type:
          type: string
          enum: [video, document, approval, none]
        related_resource_id: { type: integer, nullable: true }
        is_read: { type: boolean }
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          nullable: true

    NotificationPreferences:
      type: object
      properties:
        channels:
          type: object
          properties:
            email: { type: boolean }
            sms: { type: boolean }
            im_webhook: { type: boolean }
            in_app: { type: boolean }
        types:
          type: object
          description: 各类通知是否启用
          properties:
            approval: { type: boolean }
            key_alert: { type: boolean }
            driver_alert: { type: boolean }
            compliance: { type: boolean }
            system: { type: boolean }
        quiet_hours:
          type: object
          properties:
            enabled: { type: boolean }
            start: { type: string, example: '22:00' }
            end: { type: string, example: '08:00' }

    # ===== Webhook（v3.1 新增）=====
    Webhook:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum:
              - approval.decided
              - key.revoked
              - driver.offline
              - document.uploaded
              - video.processed
        secret:
          type: string
          description: 签名密钥（创建时返回一次）
        status:
          type: string
          enum: [active, paused, failed]
        created_at: { type: string, format: date-time }

    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
        events:
          type: array
          items: { type: string }
          minItems: 1
        description: { type: string }

    WebhookDelivery:
      type: object
      properties:
        id: { type: integer }
        webhook_id: { type: integer }
        event: { type: string }
        payload: { type: string, description: JSON 负载 }
        response_status: { type: integer }
        response_body: { type: string }
        delivered_at: { type: string, format: date-time }
        retry_count:
          type: integer
          description: 第几次尝试（1 = 首次投递，2 = 第一次重试 …）
        next_retry_at:
          type: string
          format: date-time
          nullable: true
          description: 下次重试时间（null = 没有待重试的 / 已成功 / 已进死信）

    # ===== 备份（v3.1 新增）=====
    Backup:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [full, incremental]
        status:
          type: string
          enum: [pending, running, completed, failed]
        size_bytes: { type: integer }
        started_at: { type: string, format: date-time }
        completed_at:
          type: string
          format: date-time
          nullable: true
        operator_id: { type: integer }
        description: { type: string }
        storage_path: { type: string, description: 备份存储位置 }