# ============================================================
# 配置测试
# ============================================================
class TestConfig:
    """配置测试"""

    def test_settings_load_defaults(self):
        from edam_worker.config import Settings
        s = Settings()
        assert s.RABBITMQ_PORT == 5672
        assert s.HLS_SEGMENT_DURATION == 10
        assert s.FINGERPRINT_KEYFRAME_INTERVAL == 30

    def test_settings_env_override(self, monkeypatch):
        monkeypatch.setenv("RABBITMQ_HOST", "test-host")
        monkeypatch.setenv("HLS_SEGMENT_DURATION", "6")
        from edam_worker.config import Settings
        s = Settings()
        assert s.RABBITMQ_HOST == "test-host"
        assert s.HLS_SEGMENT_DURATION == 6


# ============================================================
# 工具函数测试
# ============================================================
class TestUtilities:
    """工具函数测试"""

    def test_temp_file_creation(self):
        import tempfile
        with tempfile.NamedTemporaryFile(suffix=".tmp", delete=False) as f:
            f.write(b"test")
            path = f.name
        try:
            assert os.path.getsize(path) == 4
        finally:
            os.unlink(path)

    def test_image_dimensions(self):
        img = Image.new("RGB", (100, 50), (0, 0, 0))
        assert img.size == (100, 50)
        arr = np.array(img)
        assert arr.shape == (50, 100, 3)


# ============================================================
# 集成测试（需要外部依赖，标记为慢测试）
# ============================================================
@pytest.mark.integration
class TestIntegration:
    """集成测试（需要真实依赖）"""

    @pytest.mark.skipif(
        not os.path.exists("/usr/bin/ffmpeg"),
        reason="ffmpeg not installed"
    )
    def test_ffmpeg_available(self):
        import subprocess
        result = subprocess.run(
            ["/usr/bin/ffmpeg", "-version"],
            capture_output=True, text=True
        )
        assert result.returncode == 0
        assert "ffmpeg version" in result.stdout
