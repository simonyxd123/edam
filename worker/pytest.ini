# ============================================================
# 水印算法测试
# ============================================================
class TestWatermarkProcessor:
    """水印处理器测试"""

    @pytest.fixture
    def processor(self):
        from edam_worker.processors.watermark import WatermarkProcessor
        return WatermarkProcessor()

    @pytest.fixture
    def sample_image(self, tmp_path):
        """生成测试图片"""
        img = Image.new("RGB", (256, 256), color=(128, 128, 128))
        # 画一些简单图形
        for x in range(50, 200, 30):
            for y in range(50, 200, 30):
                img.putpixel((x, y), (255, 0, 0))
        path = tmp_path / "test.png"
        img.save(path)
        return str(path)

    def test_lsb_embed_and_extract_roundtrip(self, processor, sample_image, tmp_path):
        """LSB 水印嵌入 + 提取回环测试"""
        output = str(tmp_path / "output.png")
        text = "user123|123456789|2026-08-12"

        # 使用 fallback LSB（避免依赖 blind-watermark）
        processor._lsb_embed(sample_image, output, text)

        # 验证文件存在
        assert os.path.exists(output)

        # 验证图片尺寸不变
        original = Image.open(sample_image)
        result = Image.open(output)
        assert original.size == result.size

    def test_lsb_embed_handles_short_text(self, processor, sample_image, tmp_path):
        """短文本也能嵌入"""
        output = str(tmp_path / "output.png")
        text = "x"
        processor._lsb_embed(sample_image, output, text)
        assert os.path.exists(output)

    def test_lsb_embed_chinese_text(self, processor, sample_image, tmp_path):
        """中文文本水印（UTF-8 多字节）"""
        output = str(tmp_path / "output.png")
        text = "测试水印-工号SA0001-2026"
        processor._lsb_embed(sample_image, output, text)
        assert os.path.exists(output)

    def test_docx_steganography_creates_file(self, processor, tmp_path):
        """Word 文档隐写（需要 docx 库）"""
        try:
            from docx import Document
        except ImportError:
            pytest.skip("docx not installed")

        # 创建一个测试 docx
        input_doc = str(tmp_path / "input.docx")
        output_doc = str(tmp_path / "output.docx")
        doc = Document()
        doc.add_paragraph("测试段落 1")
        doc.add_paragraph("机密内容")
        doc.save(input_doc)

        processor._docx_steganography(input_doc, output_doc, "test|12345|2026")

        assert os.path.exists(output_doc)
        # 验证可重新打开
        Document(output_doc)

    def test_pdf_watermark_fallback(self, processor, tmp_path):
        """PDF 水印失败 fallback 到原文件"""
        try:
            from PyPDF2 import PdfReader, PdfWriter
        except ImportError:
            pytest.skip("PyPDF2 not installed")

        # 创建一个简单的 PDF
        input_pdf = str(tmp_path / "input.pdf")
        output_pdf = str(tmp_path / "output.pdf")

        writer = PdfWriter()
        writer.add_blank_page(width=200, height=200)
        with open(input_pdf, "wb") as f:
            writer.write(f)

        processor.embed_pdf(input_pdf, output_pdf, "test|123")

        # 失败时 fallback 到原文件
        assert os.path.exists(output_pdf)


