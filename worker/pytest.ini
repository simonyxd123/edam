[pytest]
# Worker 单元测试配置
#
# 注：原先这个文件里装的是 **Python 测试代码**（225 行的 .py 内容），
# pytest 会把它当 INI 配置解析 → 解析失败；而且那些测试代码**从不被收集**
# （pytest 只收集 test_*.py）。等于 13 个测试用例从来没执行过，
# CI 的 worker:test job 跑 pytest 会 exit code 5（no tests collected）直接失败。
# 现在代码已移到 tests/test_worker.py，本文件回归它本来的身份：配置。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 包在 src/ 下，不加这行 pytest 报 ModuleNotFoundError: No module named 'edam_worker'
# （CI 里同理 —— 之前 worker:test 跑的是 `cd worker && pytest`，
#  没有 PYTHONPATH=src，import 全挂）
pythonpath = src
asyncio_mode = auto
markers =
    integration: 需要真实外部依赖（ffmpeg / RabbitMQ / MinIO）的慢测试
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
