# ============================================================================
# GitOps Overlays: 生产环境配置
# ============================================================================

backend:
  replicaCount: 5
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  env:
    SPRING_PROFILES_ACTIVE: production
    LOG_LEVEL: INFO
    # 严格模式
    SERVER_TOMCAT_MAX_THREADS: 400

worker:
  replicaCount: 3
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

nginx:
  enabled: true
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    # 上传相关：必须与后端 max-file-size=8GB 及 base values 对齐。
    # Helm 会用 overlay 覆盖 base 的同名注解，之前这里钉死 500m/300s，
    # 导致 100MB 以上的大文件在生产环境被 ingress 直接 413 挡掉。
    nginx.ingress.kubernetes.io/proxy-body-size: "8g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "21600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "21600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: edam-tls
      hosts:
        - api.example.com

# 密钥（必须通过 External Secrets 从 Vault 同步）
#
# 重要：External Secrets Operator 会把 Vault 里的值写进
# <fullname>-secret（edam-secret），覆盖 helm 模板里渲染的占位值。
# 这里的值只是"让 chart 能渲染出来"的占位，**不能**在生产用真值
# （真值在 Git 里 = 泄密）。
#
# workerToken 同理 —— 它是 Worker → Backend 回调的共享密钥，
# 两侧必须一致（后端读 edam.worker.token，worker 读 WORKER_TOKEN）。
secret:
  dbPassword: "REPLACE_FROM_VAULT"
  vaultToken: "REPLACE_FROM_VAULT"
  jwtSecret: "REPLACE_FROM_VAULT"
  workerToken: "REPLACE_FROM_VAULT"
  # adminPassword 留空 → 后端不创建任何默认账号（fail-closed）
  adminPassword: ""