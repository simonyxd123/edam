# ============================================================================
# GitOps Overlays: 预发布环境配置
# ============================================================================

backend:
  replicaCount: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    SPRING_PROFILES_ACTIVE: staging
    LOG_LEVEL: INFO

worker:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

nginx:
  enabled: true
  replicaCount: 1

ingress:
  enabled: true
  hosts:
    - host: staging-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: staging-tls
      hosts:
        - staging-api.example.com

# 密钥（必须通过 External Secrets 从 Vault 同步）
#
# externalSecrets.enabled=true ⇒ helm **不再渲染** <fullname>-secret，
# 改由 External Secrets Operator 从 Vault 写入同名 Secret。
#
# 为什么必须开（2026-11-14 代码审计第七轮）：
# 原来的 ExternalSecret 清单放在 gitops/argocd/external-secrets.yaml，
# 而三个 ArgoCD Application **都不引用它** ⇒ 那套 External Secrets
# 从来没有被下发到集群 ⇒ 实际生效的就是下面这些仓库里公开的占位符。
# 顺带把 workerToken 补上 —— 它原来连占位符都没有，直接继承 helm base 的
# `change-me-in-production`，而 Worker 与 Backend 两边读到同一个公开值，
# 校验自然通过 ⇒ 任何人都能伪造文档状态回调。
externalSecrets:
  enabled: true

secret:
  dbPassword: "REPLACE_FROM_VAULT"
  vaultToken: "REPLACE_FROM_VAULT"
  jwtSecret: "REPLACE_FROM_VAULT"
  workerToken: "REPLACE_FROM_VAULT"