# ============================================================================
# ArgoCD Application: EDAM 预发布环境
# 自动同步：main 分支更新
# 人工审批：手动触发
# ============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: edam-staging
  namespace: argocd
  labels:
    env: staging
    app: edam
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: edam

  source:
    repoURL: 'https://github.com/example/edam.git'
    targetRevision: main
    path: .
    chart: helm/edam
    helm:
      releaseName: edam-staging
      valueFiles:
        - gitops/overlays/staging/values.yaml
      parameters:
        - name: global.imageRegistry
          value: ghcr.io/example/edam
        - name: backend.image.tag
          value: $ARGOCD_APP_REVISION

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: edam-staging

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    # ⚠️ `automated: {}` **不是**"禁用自动同步"——
    # ArgoCD 里 `automated` 是个结构体，写成 {} 就是"开启自动同步、
    # 用默认参数"（prune 默认 true、selfHeal 默认 false）。
    # 真正禁用要写 `automated: null`（prod 就是这么写的）。
    #
    # 原来的注释写的是"禁用自动同步，需手动"，YAML 干的是另一回事：
    # staging 每一次 main 分支推送都会**自动同步 + 自动 prune**。
    # 这跟 README 里那张表写的"手工"也对不上 —— 两处都以为它是手工的。
    automated: null  # 禁用自动同步，需手动
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10

  # 通知（使用 ArgoCD Notifications）
  # 实际部署需配置 argocd-notifications ConfigMap