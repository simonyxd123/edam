# ============================================================================
# External Secrets Operator: 从 Vault 同步密钥到 K8s
# 用于在 GitOps 中管理密钥（避免明文存储在 Git）
# ============================================================================

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: edam
spec:
  provider:
    vault:
      server: "http://vault:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "edam-backend"
          serviceAccountRef:
            name: "edam-backend"

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: edam-db-credentials
  namespace: edam
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: edam-db-secret
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: edam/database
        property: password
    - secretKey: db-username
      remoteRef:
        key: edam/database
        property: username

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: edam-jwt-secret
  namespace: edam
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: edam-jwt-secret
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: edam/jwt
        property: secret

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: edam-vault-token
  namespace: edam
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: edam-vault-token
    creationPolicy: Owner
  data:
    - secretKey: vault-token
      remoteRef:
        key: edam/vault
        property: token