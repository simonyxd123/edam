# ============================================================================
# GitLab CI/CD Pipeline
# 企业全格式数字资产防泄密系统
# ============================================================================

stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_REGISTRY: registry.gitlab.com
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  HELM_CHART_VERSION: $CI_COMMIT_TAG

# ----------------------------------------------------------------------------
# 1. 文档与 Schema Lint
# ----------------------------------------------------------------------------
docs:lint:
  stage: lint
  image: python:3.10
  script:
    - pip install pyyaml
    - python -c "import yaml; yaml.safe_load(open('doc/openapi.yaml'))" || exit 1
    - echo "OpenAPI YAML 语法 OK"
    - |
      for f in doc/*.drawio; do
        python -c "import xml.etree.ElementTree as ET; ET.parse('$f')" || exit 1
      done
      echo "drawio XML 语法 OK"
    # bc 必须装：python:3.10 镜像里没有 → `bc -l` 报 command not found →
    # 命令替换得到空串 → [ "" = "1" ] 恒假 → 覆盖率掉到 0% 也照样绿灯
    - apt-get update -qq && apt-get install -y -qq curl bc
    - curl -fsSL https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz | tar -xz
    - mv linux-amd64/helm /usr/local/bin/
    - helm lint helm/edam -f gitops/overlays/prod/values.yaml
    # v3.2 V-10: 后端 Controller vs OpenAPI 一致性扫描（覆盖 95% 强制）
    - python scripts/check_controller_coverage.py
    - |
      COVERAGE=$(grep -oP '已覆盖.*?\(\K[\d.]+(?=%)' modify/controller-coverage.md | head -1)
      if [ -z "$COVERAGE" ]; then
        echo "ERROR: 无法从 modify/controller-coverage.md 读取覆盖率"
        exit 1
      fi
      echo "当前 OpenAPI Controller 覆盖率: ${COVERAGE}%"
      if [ "$(echo "$COVERAGE < 95" | bc -l)" = "1" ]; then
        echo "ERROR: 覆盖率 ${COVERAGE}% 低于 95% 阈值"
        echo "请运行 'python scripts/check_controller_coverage.py' 查看缺失端点"
        exit 1
      fi
  artifacts:
    paths:
      - modify/controller-coverage.md
    expire_in: 30 days
  rules:
    - changes:
        - doc/**/*
        - helm/**/*
        - backend/**/*

# ----------------------------------------------------------------------------
# 2. 数据库迁移
# ----------------------------------------------------------------------------
db:migrate:
  stage: test
  image: mysql:8.0
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: "test"
    MYSQL_DATABASE: "edam_test"
  script:
    - apt-get update -qq && apt-get install -y -qq curl default-mysql-client
    - curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/10.10.0/flyway-commandline-10.10.0-linux-x64.tar.gz | tar -xz
    - mv flyway-10.10.0 /opt/flyway
    - export PATH="/opt/flyway:$PATH"
    - sleep 30  # 等待 MySQL 启动
    # 一次 migrate，locations 指向包含 migration + seed 的共同父目录。
    # 原来分两次 migrate：两次调用共用默认的 flyway_schema_history 表，
    # 第二次会因为"已应用但本次 locations 里找不到"直接报错
    # Detected applied migration not resolved locally
    # 迁移脚本的唯一权威目录：backend/src/main/resources/db/migration
    # （与后端运行时 Spring Flyway 读的 classpath:db/migration 完全一致）
    # 迁移前先做静态校验（不需要真库也能查）：
    #   1. model 字段 ↔ 运行时 schema 是否匹配
    #   2. 迁移链是否自洽（无悬空 ALTER / 重复版本）
    #   3. 全新库上每条外键两端类型是否兼容
    # 这三项能提前抓到 "Unknown column" 与 "Error 3780 are incompatible"
    - python dev/db/_validate_model_schema.py
    - python dev/db/_validate_migrations.py
    - python dev/db/_validate_fk_types.py
    # locations 只含迁移目录 —— seed（k6 压测用户等）不进迁移链，
    # 需要时手工执行 dev/db/seed/*.sql
    - flyway -url=jdbc:mysql://mysql:3306/edam_test?allowPublicKeyRetrieval=true -user=root -password=test -locations=filesystem:backend/src/main/resources/db/migration migrate
    - |
      TABLES=$(mysql -hmysql -uroot -ptest -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='edam_test'")
      if [ "$TABLES" -lt 20 ]; then
        echo "ERROR: 期望至少 20 张表，实际 $TABLES"
        exit 1
      fi
      echo "数据库表数量: $TABLES OK"
  rules:
    - changes:
        - dev/db/**/*

# ----------------------------------------------------------------------------
# 3. 后端测试
# ----------------------------------------------------------------------------
backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    # 必须 clean：Maven 的 resources 插件只复制/覆盖，**不删除**源里已移除
    # 的资源。删过迁移文件后，target/classes/db/migration/ 里会残留旧脚本，
    # Flyway 会同时加载两套 schema → 外键报 are incompatible（Error 3780）。
    - mvn -B clean test -DfailIfNoTests=false
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
  rules:
    - changes:
        - backend/**/*
        - pom.xml

# ----------------------------------------------------------------------------
# 4. Worker 测试
# ----------------------------------------------------------------------------
worker:test:
  stage: test
  image: python:3.10
  before_script:
    # 注意：before_script 和 script 在同一个 shell 里执行，
    # 原来两处都 `cd worker` → 第二句 cd worker 报
    # "cd: worker: No such file or directory" → job 必失败
    - pip install -r worker/requirements.txt
    - pip install -r worker/requirements-dev.txt
  script:
    - cd worker && pytest --cov=. --cov-report=xml --cov-report=term
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: worker/coverage.xml
  rules:
    - changes:
        - worker/**/*

# ----------------------------------------------------------------------------
# 4.5 E2E 测试（Playwright）
# ----------------------------------------------------------------------------
# 之前 e2e/ 目录里有 playwright + cypress 两套测试，但**CI 完全没接** ——
# 端到端链路从来没被自动验证过。
#
# 用 mcr.microsoft.com/playwright 镜像：自带 Node + Python3 + 各浏览器，
# 免去 CI 里再装浏览器。mock server 用 dev/mock/server.py（零第三方依赖），
# 不用 Prism（job 镜像里没有 docker）。
e2e:test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.45.0-jammy
  variables:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    # CI 里不用连真实后端，全部打 mock
    CI: "true"
  before_script:
    - cd e2e && npm ci
  script:
    # 只跑 chromium：firefox/webkit 在这个镜像里还得额外下浏览器，
    # CI 阶段没必要拖这么久
    - cd e2e && npx playwright test --project=chromium --reporter=list,junit
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/results/
    expire_in: 7 days
    reports:
      junit: e2e/results/junit.xml
  rules:
    - changes:
        - e2e/**/*
        - dev/mock/**/*
        - doc/openapi.yaml

# ----------------------------------------------------------------------------
# 5. 前端构建
# ----------------------------------------------------------------------------
frontend:build:
  stage: build
  image: node:18
  script:
    - cd web
    - npm ci
    - npm run lint
    - npm test
    - npm run build
  artifacts:
    paths:
      - web/dist/
  rules:
    - changes:
        - web/**/*

# ----------------------------------------------------------------------------
# 6. 镜像构建（仅 main/tag）
# ----------------------------------------------------------------------------
docker:build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $DOCKER_REGISTRY
  script:
    - |
      for svc in backend worker web; do
        docker build -f docker/${svc}.Dockerfile -t $DOCKER_REGISTRY/$CI_PROJECT_PATH/${svc}:$IMAGE_TAG .
        docker push $DOCKER_REGISTRY/$CI_PROJECT_PATH/${svc}:$IMAGE_TAG
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ----------------------------------------------------------------------------
# 7. Helm Chart 打包
# ----------------------------------------------------------------------------
helm:package:
  stage: build
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl
    - curl -fsSL https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz | tar -xz
    - mv linux-amd64/helm /usr/local/bin/
  script:
    - cd helm
    - helm package edam
    - helm repo index .
  artifacts:
    paths:
      - helm/*.tgz
  rules:
    - if: '$CI_COMMIT_TAG'

# ----------------------------------------------------------------------------
# 8. 部署到预发布（仅 develop）
# ----------------------------------------------------------------------------
deploy:staging:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl kubectl
  script:
    - echo "部署到预发布环境"
    - kubectl config use-context $KUBE_CONTEXT_STAGING
    # 必须带 -f gitops/overlays/<env>/values.yaml：
    # 不带的话 overlay 里的副本数 / 资源限额 / 阈值全部不生效，
    # prod 也在用 base values 的 3 副本 + 8g ingress
    # 同时必须覆盖 worker.image.tag —— 否则 backend 滚到新 SHA、
    # worker 留在旧 tag（CI 只推 SHA tag，那个 tag 压根不存在）
    - helm upgrade --install edam helm/edam
        --namespace edam-staging
        -f gitops/overlays/staging/values.yaml
        --set backend.image.tag=$IMAGE_TAG
        --set worker.image.tag=$IMAGE_TAG
        --set web.image.tag=$IMAGE_TAG
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  when: manual

# ----------------------------------------------------------------------------
# 9. 部署到生产（仅 tag）
# ----------------------------------------------------------------------------
deploy:production:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl kubectl
  script:
    - echo "部署到生产环境"
    - kubectl config use-context $KUBE_CONTEXT_PROD
    - helm upgrade --install edam helm/edam
        --namespace edam
        -f gitops/overlays/prod/values.yaml
        --set backend.image.tag=$IMAGE_TAG
        --set worker.image.tag=$IMAGE_TAG
        --set web.image.tag=$IMAGE_TAG
  environment:
    name: production
    url: https://api.example.com
  rules:
    - if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: false