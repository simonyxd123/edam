# ============================================================================
# GitLab CI/CD Pipeline
# 企业全格式数字资产防泄密系统
# ============================================================================

stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_REGISTRY: registry.gitlab.com
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  HELM_CHART_VERSION: $CI_COMMIT_TAG

# ----------------------------------------------------------------------------
# 1. 文档与 Schema Lint
# ----------------------------------------------------------------------------
docs:lint:
  stage: lint
  image: python:3.10
  script:
    - pip install pyyaml
    - python -c "import yaml; yaml.safe_load(open('doc/openapi.yaml'))" || exit 1
    - echo "OpenAPI YAML 语法 OK"
    - |
      for f in doc/*.drawio; do
        python -c "import xml.etree.ElementTree as ET; ET.parse('$f')" || exit 1
      done
      echo "drawio XML 语法 OK"
    - apt-get update -qq && apt-get install -y -qq curl
    - curl -fsSL https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz | tar -xz
    - mv linux-amd64/helm /usr/local/bin/
    - helm lint helm/edam
  rules:
    - changes:
        - doc/**/*
        - helm/**/*

# ----------------------------------------------------------------------------
# 2. 数据库迁移
# ----------------------------------------------------------------------------
db:migrate:
  stage: test
  image: mysql:8.0
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: "test"
    MYSQL_DATABASE: "edam_test"
  script:
    - apt-get update -qq && apt-get install -y -qq curl default-mysql-client
    - curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/10.10.0/flyway-commandline-10.10.0-linux-x64.tar.gz | tar -xz
    - mv flyway-10.10.0 /opt/flyway
    - export PATH="/opt/flyway:$PATH"
    - sleep 30  # 等待 MySQL 启动
    - flyway -url=jdbc:mysql://mysql:3306/edam_test?allowPublicKeyRetrieval=true -user=root -password=test -locations=filesystem:dev/db/migration migrate
    - flyway -url=jdbc:mysql://mysql:3306/edam_test?allowPublicKeyRetrieval=true -user=root -password=test -locations=filesystem:dev/db/seed migrate
    - |
      TABLES=$(mysql -hmysql -uroot -ptest -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='edam_test'")
      if [ "$TABLES" -lt 20 ]; then
        echo "ERROR: 期望至少 20 张表，实际 $TABLES"
        exit 1
      fi
      echo "数据库表数量: $TABLES OK"
  rules:
    - changes:
        - dev/db/**/*

# ----------------------------------------------------------------------------
# 3. 后端测试
# ----------------------------------------------------------------------------
backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -B test -DfailIfNoTests=false
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
  rules:
    - changes:
        - backend/**/*
        - pom.xml

# ----------------------------------------------------------------------------
# 4. Worker 测试
# ----------------------------------------------------------------------------
worker:test:
  stage: test
  image: python:3.10
  before_script:
    - cd worker
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
  script:
    - cd worker
    - pytest --cov=. --cov-report=xml --cov-report=term
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: worker/coverage.xml
  rules:
    - changes:
        - worker/**/*

# ----------------------------------------------------------------------------
# 5. 前端构建
# ----------------------------------------------------------------------------
frontend:build:
  stage: build
  image: node:18
  script:
    - cd web
    - npm ci
    - npm run lint
    - npm test
    - npm run build
  artifacts:
    paths:
      - web/dist/
  rules:
    - changes:
        - web/**/*

# ----------------------------------------------------------------------------
# 6. 镜像构建（仅 main/tag）
# ----------------------------------------------------------------------------
docker:build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $DOCKER_REGISTRY
  script:
    - |
      for svc in backend worker web; do
        docker build -f docker/${svc}.Dockerfile -t $DOCKER_REGISTRY/$CI_PROJECT_PATH/${svc}:$IMAGE_TAG .
        docker push $DOCKER_REGISTRY/$CI_PROJECT_PATH/${svc}:$IMAGE_TAG
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ----------------------------------------------------------------------------
# 7. Helm Chart 打包
# ----------------------------------------------------------------------------
helm:package:
  stage: build
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl
    - curl -fsSL https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz | tar -xz
    - mv linux-amd64/helm /usr/local/bin/
  script:
    - cd helm
    - helm package edam
    - helm repo index .
  artifacts:
    paths:
      - helm/*.tgz
  rules:
    - if: '$CI_COMMIT_TAG'

# ----------------------------------------------------------------------------
# 8. 部署到预发布（仅 develop）
# ----------------------------------------------------------------------------
deploy:staging:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl kubectl
  script:
    - echo "部署到预发布环境"
    - kubectl config use-context $KUBE_CONTEXT_STAGING
    - helm upgrade --install edam helm/edam --namespace edam-staging --set backend.image.tag=$IMAGE_TAG
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  when: manual

# ----------------------------------------------------------------------------
# 9. 部署到生产（仅 tag）
# ----------------------------------------------------------------------------
deploy:production:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl kubectl
  script:
    - echo "部署到生产环境"
    - kubectl config use-context $KUBE_CONTEXT_PROD
    - helm upgrade --install edam helm/edam --namespace edam --set backend.image.tag=$IMAGE_TAG
  environment:
    name: production
    url: https://api.example.com
  rules:
    - if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: false