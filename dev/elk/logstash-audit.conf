# Logstash 审计日志管道（v3.3 W-1 G-3）
# 用于等保三级集中日志审计

input {
  # 后端 Spring Boot 日志（Filebeat 推送的 JSON）
  beats {
    port => 5044
    ssl => false
  }

  # 直接 TCP 输入（轻量部署）
  tcp {
    port => 5045
    codec => json_lines
  }

  # 后端 API 访问日志（K8s sidecar）
  http {
    port => 8081
    codec => json
  }
}

filter {
  # 1. 解析时间戳
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
    target => "@timestamp"
  }

  # 2. 富化字段（Geo IP）
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geo"
    }
  }

  # 3. 标记服务
  if [service] == "" or ![service] {
    mutate { add_field => { "service" => "edam-backend" } }
  }

  # 4. 解析 operation_type（重命名 + 校验）
  if [operation_type] {
    mutate { rename => { "operation_type" => "operation" } }
  }

  # 5. 完整性 hash（用于 WORM 校验）
  fingerprint {
    source => ["timestamp", "service", "user_id", "operation", "resource_type", "resource_id", "ip", "result"]
    target => "integrity_hash"
    method => "SHA256"
  }

  # 6. 过滤调试日志（保留 INFO+）
  if [log_level] == "DEBUG" or [log_level] == "TRACE" {
    drop { }
  }
}

output {
  # 主输出：Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    index => "edam-audit-%{+YYYY.MM.dd}"
    template_name => "edam-audit"
    template_overwrite => false
  }

  # 备份：本地磁盘（短期，7 天）
  file {
    path => "/var/log/edam-audit/%{+YYYY-MM-dd}.log"
    codec => json_lines
  }

  # 关键告警：实时通知（Slack/钉钉）
  if [log_level] == "ERROR" or [operation_type] == "security_event" {
    http {
      url => "https://hooks.example.com/alerts"
      http_method => "post"
      format => "json"
      content_type => "application/json"
    }
  }
}