# ELK 集中审计 Docker Compose（v3.3 W-1 G-3）
# 用于等保三级集中日志审计 ≥ 180 天

version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: edam-es-audit
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-edam_audit_pwd}
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./elasticsearch-audit.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./audit-index-template.json:/usr/share/elasticsearch/config/audit-template.json:ro
      - ./ilm-policy.json:/usr/share/elasticsearch/config/ilm-policy.json:ro
      - es-audit-data:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs:ro
    ports:
      - "9200:9200"
    networks:
      - audit-net

  # ILM 策略初始化
  ilm-init:
    image: curlimages/curl:8.4.0
    depends_on:
      - elasticsearch
    networks:
      - audit-net
    entrypoint: ["/bin/sh", "-c"]
    command: |
      sleep 30
      echo "Applying ILM policy..."
      curl -X PUT "http://elasticsearch:9200/_ilm/policy/edam-audit-policy" \
        -u elastic:${ELASTIC_PASSWORD:-edam_audit_pwd} \
        -H 'Content-Type: application/json' \
        -d @/usr/share/elasticsearch/config/ilm-policy.json
      echo "Applying audit index template..."
      curl -X PUT "http://elasticsearch:9200/_index_template/audit-template" \
        -u elastic:${ELASTIC_PASSWORD:-edam_audit_pwd} \
        -H 'Content-Type: application/json' \
        -d @/usr/share/elasticsearch/config/audit-template.json
      echo "Creating audit alias..."
      curl -X PUT "http://elasticsearch:9200/edam-audit-000001" \
        -u elastic:${ELASTIC_PASSWORD:-edam_audit_pwd}
      curl -X POST "http://elasticsearch:9200/_aliases" \
        -u elastic:${ELASTIC_PASSWORD:-edam_audit_pwd} \
        -H 'Content-Type: application/json' \
        -d '{"actions":[{"add":{"index":"edam-audit-000001","alias":"edam-audit"}}]}'
      echo "Init done."

  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.0
    container_name: edam-logstash
    depends_on:
      - elasticsearch
    volumes:
      - ./logstash-audit.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-edam_audit_pwd}
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "5044:5044"
      - "5045:5045"
    networks:
      - audit-net

  # Kibana 可视化
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: edam-kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-kibana_pwd}
    ports:
      - "5601:5601"
    networks:
      - audit-net

volumes:
  es-audit-data:

networks:
  audit-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-edam-audit