# Nginx + ModSecurity WAF 配置（v3.3 W-1 G-1）
# OWASP CRS 4.x + 自定义业务规则

# 加载 ModSecurity 模块
load_module modules/ngx_http_modsecurity_module.so;

# ModSecurity 全局配置
modsecurity on;
modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

# OWASP CRS 规则集加载
modsecurity_rules '
    # 基础配置
    SecRuleEngine On
    SecRequestBodyAccess On
    SecResponseBodyAccess On
    SecResponseBodyLimit 524288
    SecResponseBodyMimeType text/plain text/html text/xml application/json
    SecDebugLogLevel 3
    SecDebugLog /var/log/modsecurity/debug.log
    SecAuditEngine RelevantOnly
    SecAuditLogRelevantStatus "^(?:5|4(?!04))"
    SecAuditLogType Serial
    SecAuditLog /var/log/modsecurity/audit.log

    # OWASP CRS 4.x 基础规则集
    Include /etc/nginx/modsecurity/owasp-crs/crs-setup.conf
    Include /etc/nginx/modsecurity/owasp-crs/rules/*.conf

    # 自定义业务规则：EDAM API 防护
    # Rule 1: SQL 注入
    SecRule REQUEST_URI "@detectSQLi" \
        "id:10001,\
        phase:1,\
        deny,\
        status:403,\
        log,\
        msg:\'EDAM: SQL injection attempt detected\',\
        tag:\'application/EDAM\',\
        severity:\'CRITICAL\'"

    # Rule 2: XSS
    SecRule ARGS "@detectXSS" \
        "id:10002,\
        phase:2,\
        deny,\
        status:403,\
        log,\
        msg:\'EDAM: XSS attempt detected\',\
        tag:\'application/EDAM\',\
        severity:\'CRITICAL\'"

    # Rule 3: 暴力破解登录（5 分钟内同一 IP 失败 ≥ 10 次）
    SecRule IP:REQ_COUNT "@eq 1" \
        "id:10003,\
        phase:1,\
        pass,\
        nolog,\
        setvar:tx.brute_force=0"

    SecRule REQUEST_METHOD "@streq POST" \
        "id:10004,\
        phase:1,\
        pass,\
        nolog,\
        chain"
        SecRule REQUEST_URI "@contains /auth/login" \
            "chain"
            SecRule TX:BRUTE_FORCE "@gt 10" \
                "setvar:tx.brute_force=+1,\
                deny,\
                status:429,\
                msg:\'EDAM: Brute force login detected\',\
                tag:\'application/EDAM\',\
                severity:\'CRITICAL\'"

    # Rule 4: 异常大请求体（> 10MB）
    SecRule REQUEST_HEADERS:Content-Length "@gt 10485760" \
        "id:10005,\
        phase:1,\
        deny,\
        status:413,\
        log,\
        msg:\'EDAM: Oversized request body\',\
        severity:\'WARNING\'"

    # Rule 5: 路径遍历
    SecRule REQUEST_URI "@rx (?i)(\\.\\./|%2e%2e)" \
        "id:10006,\
        phase:1,\
        deny,\
        status:403,\
        log,\
        msg:\'EDAM: Path traversal attempt\',\
        severity:\'CRITICAL\'"

    # Rule 6: 健康检查白名单
    SecRule REQUEST_URI "@beginsWith /health" \
        "id:10007,\
        phase:1,\
        pass,\
        nolog,\
        skipAfter:END_HEALTH"

        SecMarker "END_HEALTH"
'

# 上游业务服务
upstream edam_backend {
    server backend-1:8080 max_fails=3 fail_timeout=30s;
    server backend-2:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;

    # 重定向到 HTTPS（生产）
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate /etc/nginx/ssl/api.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/api.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ModSecurity 引擎
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

    client_max_body_size 100M;

    location / {
        proxy_pass http://edam_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    # 健康检查旁路
    location /health/ {
        modsecurity_rules_file /etc/nginx/modsecurity/health-bypass.conf;
        proxy_pass http://edam_backend;
    }
}