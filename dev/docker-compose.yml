version: '3.8'

# ============================================================================
# 企业全格式数字资产防泄密系统 - 本地开发环境
# 一键启动所有依赖：MySQL / Redis / MinIO / RabbitMQ / Vault / Prometheus / Grafana
#
# 使用：
#   docker-compose up -d          # 启动所有服务
#   docker-compose down           # 停止所有服务
#   docker-compose logs -f mysql  # 查看日志
#   docker-compose ps             # 查看状态
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. MySQL 8.0（业务数据库）
  # --------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: edam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edam}
      MYSQL_USER: ${MYSQL_USER:-edam}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-edampass}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --max_connections=500
      - --innodb_buffer_pool_size=2G
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/migration:/docker-entrypoint-initdb.d/01-migration:ro
      - ./db/seed:/docker-entrypoint-initdb.d/02-seed:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edam-net

  # --------------------------------------------------------------------------
  # 2. Redis Cluster（缓存 + 会话）
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: edam-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edam-net

  # --------------------------------------------------------------------------
  # 3. MinIO（对象存储：视频/文档/水印副本）
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: edam-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - edam-net

  # MinIO 客户端：自动创建 bucket
  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    container_name: edam-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/edam-videos &&
      mc mb --ignore-existing local/edam-documents &&
      mc mb --ignore-existing local/edam-watermarks &&
      mc anonymous set download local/edam-videos &&
      mc anonymous set download local/edam-documents &&
      echo 'MinIO buckets created successfully'
      "
    networks:
      - edam-net

  # --------------------------------------------------------------------------
  # 4. RabbitMQ 3（消息队列）
  # --------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: edam-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edam}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-edampass}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - edam-net

  # --------------------------------------------------------------------------
  # 5. Vault（密钥管理）
  # --------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: edam-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    command: ["vault", "server", "-dev"]
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - edam-net

  # --------------------------------------------------------------------------
  # 6. Elasticsearch 8（全文搜索）
  # --------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: edam-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - edam-net

  # --------------------------------------------------------------------------
  # 7. Prometheus（指标收集）
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: edam-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - edam-net

  # --------------------------------------------------------------------------
  # 8. Grafana（指标可视化）
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: edam-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - edam-net

  # --------------------------------------------------------------------------
  # 9. API Mock Server（基于 openapi.yaml + Prism）
  # --------------------------------------------------------------------------
  mock-api:
    image: stoplight/prism:5
    container_name: edam-mock-api
    restart: unless-stopped
    command: >
      mock -p 4010
            -h 0.0.0.0
            --dynamic
    ports:
      - "4010:4010"
    volumes:
      - ../doc/openapi.yaml:/tmp/openapi.yaml:ro
    networks:
      - edam-net

# ============================================================================
# 命名卷（数据持久化）
# ============================================================================
volumes:
  mysql_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  es_data:
  prometheus_data:
  grafana_data:

# ============================================================================
# 自定义网络
# ============================================================================
networks:
  edam-net:
    driver: bridge
    name: edam-net