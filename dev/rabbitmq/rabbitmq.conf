# ============================================================================
# EDAM 本地开发环境 —— RabbitMQ 配置
#
# 挂载到容器：/etc/rabbitmq/rabbitmq.conf
# ============================================================================

# ---------------------------------------------------------------------------
# consumer_timeout —— 未确认投递超时（毫秒）
#
# **为什么必须调大**（默认值 1800000 = 30 分钟，会咬人）：
#
# RabbitMQ 规定：一条消息投递出去之后，如果超过 consumer_timeout
# 还没被 ack（确认），broker 就认为"这个消费者卡住了"，
# 于是**直接掐断 channel**（PRECONDITION_FAILED）。
#
# 掐断 channel ⇒ 正在跑的那个 consumer 协程被连带取消 ⇒
# 异常以 asyncio.CancelledError 的形式冒出来。
# 而 CancelledError 在 Python 3.8+ 继承的是 **BaseException**，
# 普通的 `except Exception` **抓不到它** ⇒
# 那次转码失败在日志、Prometheus、/health/worker 里全都看不见，
# 而视频确实没转出来（用户点播放还是 404）。
#
# EDAM 的视频转码动辄几十分钟（下载 + HLS 切片 + 指纹 + 上传），
# 30 分钟根本不够 —— 2026-11-10 线上就是这么丢了一批视频。
#
# 这里给 **4 小时（14400000 ms）**。
# 必须 **大于** worker 的 WORKER_TASK_DEADLINE_SEC（默认 3 小时 = 10800s），
# 否则 broker 会先掐断 channel，worker 自己那个干净的超时错误就永远等不到。
#
# ⚠️ 各版本 RabbitMQ 的配置方式不同：
#   - 3.8 ~ 3.11：节点级 `consumer_timeout`（就是这里用的）
#   - 3.12 ~ 4.x ：节点级仍可用，但官方推荐改成**按队列**配：
#                  队列参数 x-consumer-timeout，或 consumer-timeout 策略
#                  （见 ops/rabbitmq/README.md）
#   - 4.3+      ：投递超时**只支持 quorum 队列**（classic 队列不再支持）
#
# 部署到生产时，**不要**照抄这个文件 —— 见 ops/rabbitmq/README.md，
# 那里按 RabbitMQ 版本分别给了做法。
# ---------------------------------------------------------------------------
consumer_timeout = 14400000
