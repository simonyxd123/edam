name: CI

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  # ===========================================================================
  # 1. 文档与 Schema 校验
  # ===========================================================================
  docs-lint:
    name: 文档与 Schema 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 yamllint
        run: pip install yamllint

      - name: 校验 OpenAPI YAML
        run: |
          python -c "import yaml; yaml.safe_load(open('doc/openapi.yaml'))" || exit 1
          echo "OpenAPI YAML 语法 OK"

      - name: 校验 drawio XML
        run: |
          for f in doc/*.drawio; do
            python -c "import xml.etree.ElementTree as ET; ET.parse('$f')" || exit 1
          done
          echo "drawio XML 语法 OK"

      - name: 校验 Helm Chart
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - run: helm lint helm/edam

      - name: 校验 Markdown 链接
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/markdown-link-check.json'
          folder-path: 'doc,modify,helm,docs'

      # v3.2 V-10: 后端 Controller vs OpenAPI 一致性扫描（覆盖 100% 强制）
      - name: OpenAPI vs Controller 一致性检查（v3.2 V-10）
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装 PyYAML
        run: pip install pyyaml

      - name: 扫描 Controller 覆盖率
        run: |
          python scripts/check_controller_coverage.py

      - name: 校验覆盖率必须 = 100%
        run: |
          # 2026-11-13 修（第三轮代码审计 §4）：
          #
          # ① 原来用 `grep -oP`（PCRE）提取覆盖率 —— **PCRE 不是所有 runner
          #    镜像都有**（GNU grep 需编译时带 --enable-pcre），
          #    没有的话这一步直接"读不到覆盖率"⇒ 报错 ⇒ CI 红。
          #    ⇒ 改用 Python 解析（runner 上本来就有 python3）。
          #
          # ② 阈值原来写的是 `< 95`，而 README / CLAUDE.md / openapi.yaml
          #    都承诺 **100%** ⇒ 95%~100% 之间掉下去 CI 是绿的，
          #    承诺与门限不一致。⇒ 提到 100。
          python3 - <<'PYEOF'
          import re
          import sys

          # 报告里的行形如： | 已覆盖 | 99 (100.0%) |
          text = open('modify/controller-coverage.md', encoding='utf-8').read()
          m = re.search(r'已覆盖\s*\|\s*\d+\s*\(\s*([\d.]+)\s*%', text)
          if not m:
              print('ERROR: 无法从 modify/controller-coverage.md 读取覆盖率')
              print('请运行 python scripts/check_controller_coverage.py 重新生成报告')
              sys.exit(1)

          coverage = float(m.group(1))
          print(f'当前 OpenAPI Controller 覆盖率: {coverage}%')
          if coverage < 100.0:
              print(f'ERROR: 覆盖率 {coverage}% 低于 100% 阈值')
              print('README / CLAUDE.md 承诺端点覆盖率 100% —— 门限必须与承诺一致')
              print('请运行 python scripts/check_controller_coverage.py 查看缺失端点')
              sys.exit(1)
          PYEOF

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: controller-coverage-report
          path: modify/controller-coverage.md

  # ===========================================================================
  # 2. 数据库迁移脚本校验
  # ===========================================================================
  db-migration:
    name: 数据库迁移脚本校验
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: edam_test
        ports: ['3307:3306']   # 容器内 3306，对外 3307（与 dev 环境一致）
        options: --health-cmd="mysqladmin ping" --health-interval=10s
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flyway
        run: |
          curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/10.10.0/flyway-commandline-10.10.0-linux-x64.tar.gz | tar -xz
          sudo mv flyway-10.10.0 /opt/flyway
          echo "/opt/flyway" >> $GITHUB_PATH

      # ---------------------------------------------------------------------
      # 静态校验（不需要真库就能查）—— 2026-11-13 接进来
      #
      # 此前这 5 个校验**只挂在 .gitlab-ci.yml** 上，而本仓库的 remote 是
      # github.com ⇒ 那条流水线**根本不会跑** ⇒
      # 「端口一致性校验、模型↔表列对账、迁移合法性校验、FK 类型校验、
      #   MySQL 端口校验」在真正会跑的 CI 里**全部缺席**。
      # CLAUDE.md 写着"仓库里有端口一致性校验"，但那个校验实际上没在跑。
      #
      # 各自的用途：
      #   1. _validate_model_schema.py —— model 字段 ↔ 运行时 schema 是否匹配
      #      （能提前抓到 "Unknown column"）
      #   2. _validate_migrations.py  —— 迁移链是否自洽（无悬空 ALTER / 重复版本）
      #      （能提前抓到 "Error 3780 are incompatible"）
      #   3. _validate_fk_types.py    —— 全新库上每条外键两端类型是否兼容
      #   4. _validate_ports.py        —— 后端端口在 11 处来源里必须一致
      #      （改一处忘另一处 = 前端全 502）
      #   5. _validate_mysql_port.py   —— MySQL 端口：容器内 3306 / 对外 3307
      #      （此前 compose 与 application.yml 用的不是一个端口 ⇒
      #        诊断脚本看的是另一个库，排查时全是误导）
      - name: 静态校验（model↔schema / 迁移链 / 外键类型 / 端口）
        run: |
          set -e
          python dev/db/_validate_model_schema.py
          python dev/db/_validate_migrations.py
          python dev/db/_validate_fk_types.py
          python dev/db/_validate_ports.py
          python dev/db/_validate_mysql_port.py

      - name: 执行迁移
        run: |
          flyway -url=jdbc:mysql://127.0.0.1:3307/edam_test?allowPublicKeyRetrieval=true -user=root -password=test -locations=filesystem:backend/src/main/resources/db/migration migrate

      - name: 执行种子数据
        run: |
          flyway -url=jdbc:mysql://127.0.0.1:3307/edam_test?allowPublicKeyRetrieval=true -user=root -password=test -locations=filesystem:backend/src/main/resources/db/migration migrate

      - name: 校验表数量
        run: |
          # 期望 35 张表（与 README / CLAUDE.md / doc/database_schema.md 一致）——
          # 原来这里写的是 `-lt 20`，缺 15 张表也照样绿灯
          TABLES=$(mysql -h127.0.0.1 -uroot -ptest -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='edam_test'" 2>/dev/null)
          if [ "$TABLES" -lt 35 ]; then
            echo "ERROR: 期望至少 35 张表，实际 $TABLES"
            exit 1
          fi
          echo "数据库表数量: $TABLES OK"

  # ===========================================================================
  # 3. 后端编译（Java）
  # ===========================================================================
  backend-build:
    name: 后端编译
    runs-on: ubuntu-latest
    needs: docs-lint
    # MySQL 是 Flyway 迁移 + ApplicationStartupTest 的验证环境
    # （迁移是 MySQL 方言，H2 的 MySQL 兼容模式跑不了这些方言，测了等于没测）
    # RabbitMQ 是因为 RabbitAdmin 启动时就要连（声明队列）
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: edam_test
        ports: ['3307:3306']   # 容器内 3306，对外 3307（与 dev 环境一致）
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: edam
          RABBITMQ_DEFAULT_PASS: edampass
        ports: ['5672:5672']
        options: --health-cmd="rabbitmq-diagnostics -q ping" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      # 测试 profile 的连接参数（backend/src/test/resources/application-test.yml）
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: '3307'
      TEST_MYSQL_DB: edam_test
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: test
      TEST_RABBITMQ_HOST: 127.0.0.1
      TEST_RABBITMQ_PORT: '5672'
      TEST_RABBITMQ_USER: edam
      TEST_RABBITMQ_PASSWORD: edampass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 缓存 Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # pom.xml 在 backend/ 下，仓库根目录没有 —— 必须进 backend/ 才能跑 mvn
      - name: 编译
        working-directory: backend
        run: mvn -B compile

      # 不再给 -DfailIfNoTests=false —— 测试必须真的跑起来。
      # ApplicationStartupTest 在真 MySQL 上跑全套 Flyway 迁移 + 上下文启动 +
      # AdminBootstrap 插入路径，是"服务器上试错"搬进 CI 的关键一环。
      # 必须 clean：Maven 的 resources 插件只复制/覆盖，**不删除**源里已移除的
      # 资源。删过迁移文件后，target/classes/db/migration/ 里会残留旧脚本，
      # Flyway 会同时加载两套 schema → 外键报 are incompatible（Error 3780）。
      - name: 单元测试
        working-directory: backend
        run: mvn -B clean test

      - name: 打包
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: 上传 JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # ===========================================================================
  # 4. Worker 单元测试（Python）
  # ===========================================================================
  worker-test:
    name: Worker 单元测试
    runs-on: ubuntu-latest
    needs: docs-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          cd worker
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 静态检查（未定义名字）
        run: |
          cd worker
          # 只卡"undefined name"这一类致命问题：
          # 2026-10-23 的"死代码清理"删掉了 main.py 的 import signal/sys
          # 却留着调用，worker 自此启动即崩、且从 2026-10-23 到 2026-10-29
          # 一次都没起来过 —— 整整 6 天没有任何 CI 报警。
          # 未使用的 import 之类风格问题不在此卡（src/ 已经是干净的）。
          python -m pyflakes src/ tests/ scripts/ > /tmp/pyflakes.txt 2>&1 || true
          if grep -q "undefined name" /tmp/pyflakes.txt; then
            cat /tmp/pyflakes.txt
            echo "::error::发现未定义的名字 —— worker 会在 import 阶段直接崩"
            exit 1
          fi
          echo "未定义名字检查 OK"

      - name: 运行测试
        run: |
          cd worker
          pytest --cov=. --cov-report=xml --cov-report=term

      - name: 上传 coverage
        uses: codecov/codecov-action@v4
        with:
          files: worker/coverage.xml

  # ===========================================================================
  # 5. 前端构建
  # ===========================================================================
  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    needs: docs-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装依赖
        run: |
          cd web
          npm ci

      - name: Lint
        run: cd web && npm run lint

      - name: 测试
        run: cd web && npm test -- --coverage

      - name: 构建
        run: cd web && npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

  # ===========================================================================
  # 6. 移动端 SDK 编译（iOS）
  # ===========================================================================
  # 2026-11-11 代码审计第四轮 §2：iOS SDK **从来就没有被编译过** ——
  # 仓库里 CI 只有后端 / 前端 / Worker 三个 job，移动端一个都没有。
  # 于是 `avPlayerLayer = = nil`（多一个 =）这种**必然编译失败**的语法错误
  # 能在仓库里躺很久没人发现：SDK 根本不可用，也没人发现它不可用。
  #
  # 这个 job 的作用就是**把"写完但没编译过"这件事变成红灯**。
  #
  # 为什么用 macos runner：iOS SDK 依赖 UIKit / AVKit / WebKit，
  # 只有 macOS 上的 Xcode 才编得了。代价是 macos runner 比 linux 贵，
  # 但这是唯一能验证的办法 —— 报告 §2.4 已记下这个权衡。
  mobile-sdk-ios:
    name: 移动端 SDK 编译（iOS）
    runs-on: macos-latest
    needs: docs-lint
    steps:
      - uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      # ⚠️ **不能用 `swift build`**：
      # 它默认按**宿主平台**（macOS）编译，而本 SDK 依赖 UIKit / AVKit / WebKit
      # —— 这些框架在 macOS 上不存在 ⇒ 会报 "no such module 'UIKit'"，
      # 那不是 SDK 的问题，是命令选错了。
      #
      # `xcodebuild -destination 'generic/platform=iOS'` 才是对的：
      # Xcode 能直接构建纯 SPM 包（不需要 .xcodeproj），
      # -scheme 用包名即可（这里 包名/目标名/产品名 三者都是 EDAMPlayer）。
      #
      # CODE_SIGNING_ALLOWED=NO：CI 没有证书，别让签名卡住编译。
      - name: 列出可用 scheme（失败时便于定位）
        working-directory: mobile-sdk/ios
        run: xcodebuild -list

      - name: 编译 iOS SDK
        working-directory: mobile-sdk/ios
        run: |
          xcodebuild build \
            -scheme EDAMPlayer \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # 顺带确认 Package.swift 能被解析（manifest 里写错的路径、
      # 缺失的 target 目录在这里就会暴露 —— 第四轮 §2 的
      # EDAMPlayerTests 目录缺失就是这种问题）
      - name: 校验 Package.swift
        working-directory: mobile-sdk/ios
        run: swift package describe --type json > /dev/null && echo "Package.swift OK"

  # ===========================================================================
  # 7. 镜像构建
  # ===========================================================================
  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [backend-build, worker-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            edam/backend:${{ github.sha }}
            edam/backend:latest

      - name: 构建 Worker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            edam/worker:${{ github.sha }}
            edam/worker:latest

      - name: 构建前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            edam/web:${{ github.sha }}
            edam/web:latest

  # ===========================================================================
  # 7. 安全扫描
  # ===========================================================================
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: docs-lint
    steps:
      - uses: actions/checkout@v4

      - name: Trivy 漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: GitLeaks 密钥扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}