name: 漏洞扫描

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每周一凌晨 02:00 触发全量扫描
    - cron: '0 2 * * 1'

jobs:
  # ===========================================================================
  # 1. 容器镜像漏洞扫描（Trivy）
  # ===========================================================================
  trivy-scan:
    name: Trivy 容器镜像漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Backend 镜像扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/library/openjdk:17-jdk-slim'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: 上传 SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-backend.sarif'

  # ===========================================================================
  # 2. 依赖漏洞扫描（Snyk）
  # ===========================================================================
  snyk-scan:
    name: Snyk 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 后端 Maven 依赖扫描
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable

      - name: Worker Python 依赖扫描
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable

      - name: 前端 npm 依赖扫描
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable

  # ===========================================================================
  # 3. SAST（静态代码分析）
  # ===========================================================================
  sast-scan:
    name: SAST 静态代码分析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey=edam-backend \
              -Dsonar.sources=backend/src/main

  # ===========================================================================
  # 4. 渗透测试（OWASP ZAP）
  # ===========================================================================
  zap-scan:
    name: OWASP ZAP 渗透测试
    runs-on: ubuntu-latest
    needs: trivy-scan
    steps:
      - uses: actions/checkout@v4

      - name: ZAP 基础扫描
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:8080/api/v1'  # 需 staging 环境
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -l PASS'  # 自动化 + JSON + PASS 等级
          fail_action: 'true'
          fail_threshold: 'HIGH'

  # ===========================================================================
  # 5. SBOM 生成（CycloneDX）
  # ===========================================================================
  sbom-generate:
    name: SBOM 生成（CycloneDX）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 后端 SBOM
        uses: cyclonedx/cyclonedx-maven-plugin@v2.7.9
        with:
          arguments: >
            -DskipTests
            -Dmaven.test.skip=true
            cyclonedx:makeBom

      - name: Worker SBOM
        run: |
          cd worker
          pip install cyclonedx-bom
          cyclonedx-py -e .

      - name: 上传 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            **/bom.xml
            **/bom.json

  # ===========================================================================
  # 6. 凭据扫描（GitLeaks）
  # ===========================================================================
  gitleaks-scan:
    name: GitLeaks 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}