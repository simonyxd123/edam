name: CD - Release

on:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  release:
    name: 发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT
          echo "MAJOR_MINOR=$(echo ${TAG} | cut -d. -f1,2)" >> $GITHUB_OUTPUT

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.MAJOR_MINOR }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest

      - name: 打包 Helm Chart
        run: |
          cd helm
          helm package edam
          helm repo index .

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            helm/*.tgz
            helm/index.yaml
          generate_release_notes: true
          body: |
            ## 变更说明
            详见各 ADR 与评审报告。

            ## 部署
            ```bash
            helm install edam oci://${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/helm/edam --version ${{ steps.version.outputs.VERSION }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}