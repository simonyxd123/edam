# ============================================================================
# PrometheusRule 告警规则（EDAM）
# 由 Prometheus Operator 自动加载
# ============================================================================

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: edam-rules
  namespace: edam
  labels:
    app: edam
    prometheus: edam
  annotations:
    description: 'EDAM 核心告警规则集'

spec:
  groups:
    # =======================================================================
    # 1. 后端服务告警
    # =======================================================================
    - name: edam-backend
      interval: 30s
      rules:
        # 高错误率
        - alert: BackendHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{application="edam-backend",status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{application="edam-backend"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: critical
            tier: application
            component: backend
          annotations:
            summary: '后端错误率过高'
            description: '5xx 错误率 {{ $value | humanizePercentage }} 超过 5% 持续 5 分钟'
            runbook: 'ops/sop/01-incident-response.md#后端服务不可用'

        # 高延迟
        - alert: BackendHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{application="edam-backend"}[5m])) by (le, uri)
            ) > 1
          for: 10m
          labels:
            severity: warning
            tier: application
            component: backend
          annotations:
            summary: '后端 P99 延迟过高'
            description: '{{ $labels.uri }} P99 延迟 {{ $value }}s 超过 1s'

        # Pod 频繁重启
        - alert: BackendPodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{pod=~"edam-.*-backend-.*"}[15m]) > 0.1
          for: 5m
          labels:
            severity: warning
            tier: infrastructure
            component: backend
          annotations:
            summary: '后端 Pod 频繁重启'
            description: 'Pod {{ $labels.pod }} 重启率 {{ $value }} 次/15分钟'

        # 内存使用率
        - alert: BackendHighMemory
          expr: |
            container_memory_usage_bytes{pod=~"edam-.*-backend-.*",container="backend"}
            / container_spec_memory_limit_bytes{pod=~"edam-.*-backend-.*",container="backend"}
            > 0.85
          for: 10m
          labels:
            severity: warning
            tier: application
            component: backend
          annotations:
            summary: '后端内存使用率 > 85%'

    # =======================================================================
    # 2. 数据库告警（MySQL）
    # =======================================================================
    - name: edam-mysql
      interval: 30s
      rules:
        # MySQL 不可达
        - alert: MySQLDown
          expr: mysql_up == 0
          for: 1m
          labels:
            severity: critical
            tier: infrastructure
            component: mysql
          annotations:
            summary: 'MySQL 不可达'
            description: 'MySQL 实例 {{ $labels.instance }} 不可达超过 1 分钟'
            runbook: 'ops/sop/01-incident-response.md#mysql-故障'

        # 慢查询
        - alert: MySQLSlowQueries
          expr: rate(mysql_global_status_slow_queries[5m]) > 5
          for: 5m
          labels:
            severity: warning
            tier: infrastructure
            component: mysql
          annotations:
            summary: 'MySQL 慢查询激增'
            description: '慢查询 {{ $value }} 条/秒'

        # 主从延迟
        - alert: MySQLReplicationLag
          expr: mysql_slave_status_seconds_behind_master > 60
          for: 5m
          labels:
            severity: warning
            tier: infrastructure
            component: mysql
          annotations:
            summary: 'MySQL 主从延迟过高'
            description: '从库延迟 {{ $value }}s 超过 60s'

        # 连接数
        - alert: MySQLHighConnections
          expr: |
            mysql_global_status_threads_connected
            / mysql_global_variables_max_connections > 0.85
          for: 5m
          labels:
            severity: warning
            tier: infrastructure
            component: mysql
          annotations:
            summary: 'MySQL 连接数使用率 > 85%'

    # =======================================================================
    # 3. Redis 告警
    # =======================================================================
    - name: edam-redis
      interval: 30s
      rules:
        - alert: RedisDown
          expr: redis_up == 0
          for: 1m
          labels:
            severity: critical
            tier: infrastructure
            component: redis
          annotations:
            summary: 'Redis 不可达'

        - alert: RedisHighMemory
          expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
          for: 5m
          labels:
            severity: warning
            tier: infrastructure
            component: redis
          annotations:
            summary: 'Redis 内存使用率 > 90%'

        - alert: RedisRejectedConnections
          expr: rate(redis_rejected_connections_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
            tier: infrastructure
            component: redis
          annotations:
            summary: 'Redis 拒绝连接'

    # =======================================================================
    # 4. RabbitMQ 告警
    # =======================================================================
    - name: edam-rabbitmq
      interval: 30s
      rules:
        - alert: RabbitMQDown
          expr: rabbitmq_up == 0
          for: 1m
          labels:
            severity: critical
            tier: infrastructure
            component: rabbitmq
          annotations:
            summary: 'RabbitMQ 不可达'

        - alert: RabbitMQQueueDepth
          expr: rabbitmq_queue_messages_ready{queue=~"q\\..*"} > 1000
          for: 10m
          labels:
            severity: warning
            tier: infrastructure
            component: rabbitmq
          annotations:
            summary: 'RabbitMQ 队列积压'
            description: '队列 {{ $labels.queue }} 积压 {{ $value }} 条消息'
          # 注：阈值 1000 对本系统来说太宽松 —— EDAM 是低吞吐业务，
          # 队列里卡住 1 条就已经是故障了（2026-10-28 就是队列里躺着 1 条
          # 没人消费，用户点播放直接 404）。精确的"卡死"判定用下面
          # edam-worker 组里的 VideoTranscodeQueue* —— 它不依赖
          # rabbitmq_exporter，后端自己就能报出队列深度。

    # =======================================================================
    # 5. Vault 告警
    # =======================================================================
    - name: edam-vault
      interval: 30s
      rules:
        - alert: VaultSealed
          expr: vault_sealed == 1
          for: 1m
          labels:
            severity: critical
            tier: security
            component: vault
          annotations:
            summary: 'Vault 已封存'
            description: 'Vault 处于封存状态，需要 unseal'
            runbook: 'ops/sop/01-incident-response.md#vault-故障'

        - alert: VaultHighUnsealDuration
          expr: vault_unsealed < 1
          for: 5m
          labels:
            severity: warning
            tier: security
            component: vault
          annotations:
            summary: 'Vault 长时间封存'

    # =======================================================================
    # 6. 业务级告警
    # =======================================================================
    - name: edam-business
      interval: 60s
      rules:
        # HLS 切片失败率高
        - alert: VideoTranscodeFailure
          expr: |
            sum(rate(worker_tasks_processed_total{task_type="video",result="failed"}[10m]))
            /
            sum(rate(worker_tasks_processed_total{task_type="video"}[10m]))
            > 0.1
          for: 10m
          labels:
            severity: warning
            tier: business
            component: worker
          annotations:
            summary: '视频转码失败率 > 10%'

        # 登录失败激增（可能暴力破解）
        - alert: SuspiciousLoginAttempts
          expr: rate(operation_log_total{operation_type="login",result="failure"}[5m]) > 10
          for: 5m
          labels:
            severity: critical
            tier: security
            component: auth
          annotations:
            summary: '可疑登录尝试激增'
            description: '登录失败 {{ $value }} 次/秒，疑似暴力破解'

        # 外发撤销激增（可能数据泄露）
        - alert: AbnormalDistributionRevokes
          expr: rate(operation_log_total{operation_type="revoke"}[5m]) > 1
          for: 5m
          labels:
            severity: warning
            tier: security
            component: distribution
          annotations:
            summary: '外发撤销异常增加'
            description: '可能存在数据泄露事件，需立即调查'

        # Vault 密钥轮转停滞
        - alert: KeyRotationStalled
          expr: time() - vault_secret_lease_duration_seconds > 7776000  # 90 天
          for: 1h
          labels:
            severity: warning
            tier: security
            component: vault
          annotations:
            summary: '密钥未在 90 天内轮转'
            description: '密钥 {{ $labels.path }} 超过 90 天未轮转'
        # 审计写入失败（合规红线：审计记录丢失）
        # AuditService 以前只打一行 error 日志就继续 —— 合规系统里
        # "静默丢审计记录"是严重问题（日志本身还会被轮转掉）。
        # 现在有 Counter，这里给它配告警。
        - alert: AuditWriteFailure
          expr: increase(edam_audit_write_failures_total[15m]) > 0
          for: 1m
          labels:
            severity: critical
            tier: compliance
            component: audit
          annotations:
            summary: '审计日志写入失败'
            description: '过去 15 分钟有 {{ $value }} 次审计写入失败 —— 合规要求审计记录不可丢，需立即排查数据库'

    # =======================================================================
    # 7. Worker / 转码流水线告警
    #
    # 这组规则来自 2026-10-28 的用户可见故障：视频点播放报
    # "网络异常，正在重试（1/3）… (HTTP 404)"，根因是 **Worker 进程没起来**，
    # 任务卡在 RabbitMQ 队列里没人消费（queue_depth=1），
    # 而当时**没有任何告警**能提前发现这件事 ——
    # 队列深度只在 /health/ready 的 JSON 里（Prometheus 抓不到），
    # 已有的积压告警阈值又是 1000 条（现场只有 1 条，永远不触发）。
    #
    # 现在：
    #   - 后端自己暴露 edam_transcode_queue_depth / _reachable 指标
    #   - worker 的 Prometheus 指标通过 ServiceMonitor 被抓取
    # =======================================================================
    - name: edam-worker
      interval: 30s
      rules:
        # Worker 没跑 —— 本次故障的直接原因。
        # min() 而不是 max()：多副本时任意一个副本挂掉都要报，
        # max() 会把"一半副本死了"藏起来。
        - alert: WorkerDown
          expr: |
            min(up{job=~".*worker.*"}) == 0
            or absent(up{job=~".*worker.*"})
          for: 2m
          labels:
            severity: critical
            tier: infrastructure
            component: worker
          annotations:
            summary: 'Worker 不可用 —— 转码任务会堆积'
            description: 'Worker 指标目标已不可达超过 2 分钟。新上传的视频会一直停在 pending，用户点播放报 404，直到 Worker 恢复。'
            runbook: 'ops/worker/README.md'

        # 队列里有消息但没人消费（本次故障的精确指纹）。
        # reachable == 1 保证 RabbitMQ 本身是通的 —— 排除"查不到队列"这种噪声。
        - alert: VideoTranscodeQueueBacklog
          expr: |
            edam_transcode_queue_reachable == 1
            and edam_transcode_queue_depth{queue="q.video.preprocess"} > 0
          for: 10m
          labels:
            severity: warning
            tier: business
            component: worker
          annotations:
            summary: '视频转码队列积压'
            description: '队列 q.video.preprocess 已积压 {{ $value }} 条消息超过 10 分钟。视频会一直停在 pending —— 检查 Worker 是否在消费。'
            runbook: 'ops/worker/README.md'

        - alert: VideoTranscodeQueueStuck
          expr: |
            edam_transcode_queue_reachable == 1
            and edam_transcode_queue_depth{queue="q.video.preprocess"} > 0
          for: 30m
          labels:
            severity: critical
            tier: business
            component: worker
          annotations:
            summary: '视频转码队列卡死'
            description: '队列 q.video.preprocess 积压超过 30 分钟 —— 转码流水线已经停止工作，用户无法播放新上传的视频。'
            runbook: 'ops/worker/README.md'

        # 文档 / 水印队列同理（低频业务，阈值同样按"分钟级"算）
        - alert: TranscodeQueueBacklog
          expr: |
            edam_transcode_queue_reachable == 1
            and edam_transcode_queue_depth{queue=~"q\\.(document\\.preprocess|watermark)"} > 0
          for: 15m
          labels:
            severity: warning
            tier: business
            component: worker
          annotations:
            summary: '文档/水印队列积压'
            description: '队列 {{ $labels.queue }} 已积压 {{ $value }} 条消息超过 15 分钟。'

        # 后端查不到队列深度 —— RabbitMQ 不可达（或权限异常）。
        # 单独成一条规则：否则 reachable=0 会让上面的积压规则一起变真，
        # 两种完全不同的故障混在一起告警，噪音掩盖真问题。
        - alert: QueueDepthProbeFailing
          expr: edam_transcode_queue_reachable == 0
          for: 5m
          labels:
            severity: warning
            tier: infrastructure
            component: rabbitmq
          annotations:
            summary: '后端查不到 RabbitMQ 队列深度'
            description: '连续 5 分钟无法获取队列深度 —— RabbitMQ 可能不可达或凭据异常。此时队列积压类告警会失效。'
