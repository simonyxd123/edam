server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    max-threads: 400
    accept-count: 200
    connection-timeout: 20s
  # v3.2 V-1 RBAC：让 Spring 自动从反向代理头解析真实 IP
  # 需要反向代理至少传 X-Forwarded-For / X-Real-IP 之一
  forward-headers-strategy: framework

spring:
  application:
    name: edam-backend
    version: 3.1.0
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
  servlet:
    multipart:
      # 上传上限：与前端校验一致（前端 Videos.vue 里 MAX_UPLOAD_BYTES = 8GiB）
      # 默认值 10MB 太小，视频动辄几 GB
      max-file-size: 8GB
      max-request-size: 8GB
      # 0 = 一律先落磁盘临时文件，绝不进 JVM 堆。
      # Spring 默认值就是 0，这里显式写出来，防止后人「优化」成内存缓冲
      # —— 8GB 文件一旦进堆就是 OOM。
      file-size-threshold: 0
      # 8GB 上传需要 ≥8GB 可用临时磁盘；不配则用 java.io.tmpdir。
      # 生产建议指向数据卷，例如 -Djava.io.tmpdir=/data/edam/tmp
      # location: ${MULTIPART_TMP_DIR:${java.io.tmpdir}}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:edam}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:edam}
    password: ${MYSQL_PASSWORD:edampass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:edam}
    password: ${RABBITMQ_PASSWORD:edampass}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        prefetch: 10
        concurrency: 2
        max-concurrency: 10
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 30000ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  # 不配置 global-config.db-config.logic-delete-*：
  # MP 3.5.7 对 OffsetDateTime deletedAt 有 bug（生成 deleted_at= 空值 SQL 语法错）。
  # 软删除过滤靠各 Repository 在 SQL 里手写 AND deleted_at IS NULL。
  # 后续升级 MP 到 3.5.9+ 再启用全局配置。

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket:
    videos: edam-videos
    documents: edam-documents
    watermarks: edam-watermarks

# Vault
vault:
  uri: ${VAULT_ADDR:http://localhost:8200}
  token: ${VAULT_TOKEN:root}

# EDAM 自定义配置
edam:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-must-be-at-least-256-bits-long-for-hmac-sha256}
    access-token-ttl-seconds: 600
    refresh-token-ttl-seconds: 604800
  # Worker → Backend 回调共享密钥。
  # PATCH /videos/{id}/status 用它鉴权（原先 permitAll，谁都能把没转码的视频标成 ready）。
  # Worker 侧用同名环境变量 WORKER_TOKEN 注入。留空则回调一律拒绝（fail-closed）。
  worker:
    token: ${WORKER_TOKEN:}
  # 启动自举：默认 admin 账号。
  # 原先硬编码 admin123 且无 profile 开关，production 也会建 —— 等保高危项。
  # 现在 admin-password 为空则不创建任何默认账号。
  bootstrap:
    admin-password: ${ADMIN_INITIAL_PASSWORD:}
    create-default-admin: ${CREATE_DEFAULT_ADMIN:false}
  rate-limit:
    login:
      per-ip: 5
      per-employee: 3
      window-seconds: 60
      # 限流桶总量硬上限（IP + 工号两个维度合计）。
      # 原先两个 ConcurrentHashMap 永不清理，而 key 是客户端可控的
      # X-Forwarded-For → 伪造 IP 即可无限撑大内存。
      max-entries: 10000
      cleanup-interval-ms: 60000
  security:
    # 受信反向代理（IP 或 CIDR，逗号分隔）。
    # 只有来自这些地址的请求才采信 X-Forwarded-For / X-Real-IP；
    # 留空 = 不信任任何代理（fail-closed）。
    # K8s 必须配 ingress 的 CIDR，否则所有请求会被记为 ingress pod IP。
    trusted-proxies: ${TRUSTED_PROXIES:}
  websocket:
    # 允许的跨域来源，逗号分隔。留空 = 只允许同源。
    # 不要用 "*" —— WebSocket 的 Origin 头必须服务端自己校验。
    allowed-origins: ${WS_ALLOWED_ORIGINS:}
  sso:
    enabled: false
    # SSO 回调 / 登录码交换用的 Redis key TTL 由代码固定为 10 分钟
    success-redirect: /login
    failure-redirect: /login?error=sso_failed
  watermark:
    cache-ttl-seconds: 86400
    cache-max-size-gb: 100
  hls:
    # HLS AES-128 密钥获取 URL 模板（%d = videoId）
    key-url-template: "/api/v1/playback/%d/key"
    # HLS m3u8 列表 URL 模板
    playlist-url-template: "/api/v1/video/%d/playlist.m3u8"
    # 播放 token 默认有效期（秒）
    token-ttl-seconds: 600

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${spring.application.version}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99

# 日志
logging:
  level:
    root: INFO
    com.example.edam: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{trace_id:-}] %logger{36} - %msg%n"
  file:
    # 日志落盘路径。K8s 里 readOnlyRootFilesystem=true 时该目录不存在
    # 也没有 volume 挂载 → Logback FileAppender 创建失败，
    # 只打一条 ERROR 就继续，文件日志彻底丢失。
    # 两种部署姿势：
    #   1) 挂 emptyDir 到 /var/log/edam（保留本文件日志）
    #   2) 生产由采集器接管（Filebeat/Fluentd 收 stdout）→ 置空即关闭文件日志
    name: ${LOG_FILE:/var/log/edam/backend.log}
    max-size: 100MB
    max-history: 30

---
# Dev profile
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
logging:
  level:
    com.example.edam: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: production
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  flyway:
    validate-on-migrate: true
    out-of-order: false
  data:
    redis:
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
logging:
  level:
    com.example.edam: INFO
    org.springframework: WARN