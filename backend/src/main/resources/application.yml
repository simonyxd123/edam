server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    max-threads: 400
    accept-count: 200
    connection-timeout: 20s

spring:
  application:
    name: edam-backend
    version: 3.1.0
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:edam}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:edam}
    password: ${MYSQL_PASSWORD:edampass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:edam}
    password: ${RABBITMQ_PASSWORD:edampass}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        prefetch: 10
        concurrency: 2
        max-concurrency: 10
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 30000ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: NOW()
      logic-not-delete-value: null

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket:
    videos: edam-videos
    documents: edam-documents
    watermarks: edam-watermarks

# Vault
vault:
  uri: ${VAULT_ADDR:http://localhost:8200}
  token: ${VAULT_TOKEN:root}

# EDAM 自定义配置
edam:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-must-be-at-least-256-bits-long-for-hmac-sha256}
    access-token-ttl-seconds: 600
    refresh-token-ttl-seconds: 604800
  rate-limit:
    login:
      per-ip: 5
      per-employee: 3
      window-seconds: 60
  watermark:
    cache-ttl-seconds: 86400
    cache-max-size-gb: 100
  hls:
    # HLS AES-128 密钥获取 URL 模板（%d = videoId）
    key-url-template: "/api/v1/playback/%d/key"
    # HLS m3u8 列表 URL 模板
    playlist-url-template: "/api/v1/video/%d/playlist.m3u8"
    # 播放 token 默认有效期（秒）
    token-ttl-seconds: 600

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${spring.application.version}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99

# 日志
logging:
  level:
    root: INFO
    com.example.edam: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{trace_id:-}] %logger{36} - %msg%n"
  file:
    name: /var/log/edam/backend.log
    max-size: 100MB
    max-history: 30

---
# Dev profile
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
logging:
  level:
    com.example.edam: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: production
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  flyway:
    validate-on-migrate: true
    out-of-order: false
  data:
    redis:
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
logging:
  level:
    com.example.edam: INFO
    org.springframework: WARN