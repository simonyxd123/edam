# ============================================================================
# SonarQube 项目配置
# ============================================================================
# 2026-11-13 补（第三轮代码审计 §4）：
#
# 此前 `.github/workflows/security-scan.yml` 的 SonarQube job 在
# **仓库根目录**跑 `mvn` —— 那里没有 pom.xml（pom.xml 在 backend/）⇒ 必然失败。
# 改成 `working-directory: backend` 之后，Sonar 就会在 backend/ 目录下找配置，
# 所以这里补上项目属性。
#
# 属性说明见 https://docs.sonarsource.com/sonarqube-server/analyzing-source-code/scanners/sonarqube-maven-plugin/parameters/

sonar.projectKey=edam-backend
sonar.projectName=EDAM Backend
sonar.projectVersion=3.4.2

# 源码目录 —— 相对本文件所在目录（backend/）
sonar.sources=src/main/java
sonar.tests=src/test/java

# 二进制与配置目录：排除掉，避免把 target/ 里的 class 当成源码
sonar.exclusions=**/target/**,**/*.class,**/node_modules/**,**/db/migration/**

# Java 版本（与 pom.xml 的 java.version 一致）
sonar.java.version=17

# 覆盖率报告（后端用 JaCoCo；没有就跳过，不让 job 因为缺报告而失败）
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# 只在 main 分支上做质量门（PR 分支不做门，避免阻塞开发）
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
